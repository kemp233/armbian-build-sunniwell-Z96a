# Z96A 的图形会话以 root 身份运行 (gdm3 AutomaticLogin=root), 而 Debian
# 的 pipewire 单元带 ConditionUser=!root —— 于是从开机到桌面起来,
# pipewire 全家桶一次都没被允许启动, systemd 日志里只有一行
# "skipped because of an unmet condition check"。
# 表现: 桌面上任何播放器都没声音, pactl 连不上。
# 硬件声卡 (rk809-codec / hdmi) 都是好的, --ao=alsa 直通可以出声。
[Unit]
ConditionUser=
