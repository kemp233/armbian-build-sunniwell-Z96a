name: Build Z96A v2 rootfs (direct)

on:
  workflow_dispatch:

jobs:
  build-z96a:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout THIS repo
        uses: actions/checkout@v4
        with:
          repository: kemp233/armbian-build-action
          path: armbian
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git uuid-dev qemu-user-static debootstrap \
            python3 python3-distutils python3-dev python3-pyelftools \
            gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross libc6-dev-armhf-cross \
            bc bison flex libssl-dev ccache debian-archive-keyring

      - name: Verify z96a patches present
        run: |
          cd armbian
          echo "=== Patches ==="
          ls -la patch/kernel/rockchip-rk3568-z96a/legacy/
          echo "=== Board ==="
          cat config/boards/z96a-v2.conf | head -5

      - name: Build rootfs (non-interactive)
        run: |
          cd armbian
          ./compile.sh build \
            BOARD=z96a-v2 \
            BRANCH=legacy \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            SHARE_LOG=yes < /dev/null

      - name: Find build output
        id: out
        run: |
          cd armbian
          ls -la output/images/ 2>&1 | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: z96a-v2-rootfs
          path: armbian/output/images/*.img.xz
          if-no-files-found: error
