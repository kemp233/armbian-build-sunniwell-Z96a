name: Build Armbian Z96A with Mali G52 (bifrost-g52-g24p0-gbm)

on:
  workflow_dispatch:
    inputs:
      armbian_release:
        description: 'Armbian release'
        type: choice
        options: [jammy, noble, bookworm]
        default: jammy
      armbian_branch:
        description: 'Armbian build framework branch'
        type: string
        default: main
      armbian_kernel_branch:
        description: 'Kernel branch'
        type: string
        default: legacy
      armbian_target:
        description: 'Build target'
        type: choice
        options: [kernel, image]
        default: image
      armbian_ui:
        description: 'Desktop environment'
        type: choice
        options: [server, minimal, xfce, kde, gnome, cinnamon]
        default: server
      mali_gpu:
        description: 'Mali GPU variant'
        type: choice
        options: [bifrost-g52, bifrost-g31, valhall-g310, valhall-g610]
        default: bifrost-g52
      mali_version:
        description: 'Mali GPU version'
        type: string
        default: g24p0
      mali_platform:
        description: 'Mali platform'
        type: choice
        options: [gbm, wayland-gbm, x11-gbm]
        default: gbm

permissions:
  contents: write

jobs:
  # 1. Cross-compile Mali G52 drivers
  build-mali:
    name: Cross-compile Mali G52
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - name: Checkout libmali-rockchip
        uses: actions/checkout@v4
        with:
          repository: kemp233/libmali-rockchip
          token: ${{ secrets.GITHUB_TOKEN }}
          path: libmali-rockchip

      - name: Configure apt sources for cross-compilation (amd64 host + arm64 target)
        run: |
          sudo dpkg --add-architecture arm64
          # Ubuntu 24.04 uses deb822 format in /etc/apt/sources.list.d/ubuntu.sources
          # Fix the default sources to only serve amd64 (security.ubuntu.com doesn't serve arm64)
          # Then add arm64 repositories from ports.ubuntu.com
          # Remove duplicate .list files
          sudo rm -f /etc/apt/sources.list.d/ports-*.list
          
          # Fix default ubuntu.sources to only serve amd64
          cat << 'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu.sources
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-security noble-backports
          Components: main restricted universe multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          
          # Add arm64 repositories from ports.ubuntu.com
          cat << 'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security noble-backports
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update

      - name: Install cross-compilation toolchain & deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config \
            libdrm-dev:arm64 libgbm-dev:arm64 libwayland-dev:arm64 \
            libx11-dev:arm64 libxext-dev:arm64 libxdamage-dev:arm64 libxcb-dri2-0-dev:arm64 \
            meson ninja-build python3 python3-pip

      - name: Install native build dependencies (for dpkg-buildpackage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper dh-make \
            libdrm-dev libgbm-dev libwayland-dev \
            libx11-dev libxext-dev libxdamage-dev libxcb-dri2-0-dev \
            pkg-config meson ninja-build

      - name: Verify pkg-config for cross-compile
        run: |
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          pkg-config --modversion libdrm
          pkg-config --modversion gbm
          pkg-config --modversion wayland-client

      - name: Create cross file
        run: |
          cat > cross_file.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-gcc-ar'
          strip = 'aarch64-linux-gnu-strip'
          # Use system pkg-config with PKG_CONFIG_PATH for cross-compilation
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a55'
          endian = 'little'

          [properties]
          sys_root = '/'
          pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig'
          EOF

      - name: Configure Meson
        run: |
          GPU="${{ inputs.mali_gpu }}"
          VER="${{ inputs.mali_version }}"
          PLATFORM="${{ inputs.mali_platform }}"
          TARGET_NAME="${GPU}-${VER}-${PLATFORM}"
          
          cd libmali-rockchip
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          meson setup build --cross-file ../cross_file.txt \
            -Dgpu=${GPU} \
            -Dversion=${VER} \
            -Dplatform=${PLATFORM} \
            -Dhooks=true \
            --prefix=/usr

      - name: Build with Ninja
        run: |
          cd libmali-rockchip
          ninja -C build

      - name: Verify build artifacts
        run: |
          cd libmali-rockchip
          ls -la build/libmali.so* build/hook/libmali-hook.so* 2>/dev/null || true

      - name: Create Debian packages manually (skip debian/rules meson re-run)
        id: package
        run: |
          GPU="${{ inputs.mali_gpu }}"
          VER="${{ inputs.mali_version }}"
          PLATFORM="${{ inputs.mali_platform }}"
          TARGET_NAME="${GPU}-${VER}-${PLATFORM}"
          
          PKG_VERSION="1.0-1"
          PKG_NAME="libmali-${TARGET_NAME}"
          DEV_PKG_NAME="libmali-${TARGET_NAME}-dev"
          DEB_DIR="${GITHUB_WORKSPACE}/mali-debs"
          
          mkdir -p "${DEB_DIR}/${PKG_NAME}/DEBIAN"
          mkdir -p "${DEB_DIR}/${PKG_NAME}/usr/lib/aarch64-linux-gnu"
          mkdir -p "${DEB_DIR}/${DEV_PKG_NAME}/DEBIAN"
          mkdir -p "${DEB_DIR}/${DEV_PKG_NAME}/usr/lib/aarch64-linux-gnu"
          mkdir -p "${DEB_DIR}/${DEV_PKG_NAME}/usr/include"
          
          # Copy runtime libraries
          cp -a libmali-rockchip/build/libmali.so* "${DEB_DIR}/${PKG_NAME}/usr/lib/aarch64-linux-gnu/"
          cp -a libmali-rockchip/build/hook/libmali-hook.so* "${DEB_DIR}/${PKG_NAME}/usr/lib/aarch64-linux-gnu/"
          
          # Copy dev files
          cp -a libmali-rockchip/build/libmali.so* "${DEB_DIR}/${DEV_PKG_NAME}/usr/lib/aarch64-linux-gnu/"
          cp -a libmali-rockchip/build/hook/libmali-hook.so* "${DEB_DIR}/${DEV_PKG_NAME}/usr/lib/aarch64-linux-gnu/"
          # Copy headers if they exist
          find libmali-rockchip/include -name "*.h" -exec cp {} "${DEB_DIR}/${DEV_PKG_NAME}/usr/include/" \; 2>/dev/null || true
          
          # Create control file for runtime package
          cat > "${DEB_DIR}/${PKG_NAME}/DEBIAN/control" << EOF
          Package: ${PKG_NAME}
          Version: ${PKG_VERSION}
          Architecture: arm64
          Maintainer: Putin Lee <putin.li@rock-chips.com>
          Depends: libc6 (>= 2.17), libdrm2 (>= 2.4.75), libgbm1 (>= 20.0), libwayland-client0 (>= 1.18), libx11-xcb1, libxcb-dri2-0, libxdamage1, libxext6
          Description: Mali GPU User-Space Binary Drivers (${TARGET_NAME})
           Mali GPU proprietary drivers for Bifrost G52.
           This package contains the shared libraries.
          EOF
          
          # Create control file for dev package
          cat > "${DEB_DIR}/${DEV_PKG_NAME}/DEBIAN/control" << EOF
          Package: ${DEV_PKG_NAME}
          Version: ${PKG_VERSION}
          Architecture: arm64
          Maintainer: Putin Lee <putin.li@rock-chips.com>
          Depends: ${PKG_NAME} (= ${PKG_VERSION})
          Description: Mali GPU User-Space Binary Drivers - Development files (${TARGET_NAME})
           Mali GPU proprietary drivers for Bifrost G52.
           This package contains the development headers and libraries.
          EOF
          
          # Build packages
          dpkg-deb --build "${DEB_DIR}/${PKG_NAME}" "${DEB_DIR}/${PKG_NAME}_${PKG_VERSION}_arm64.deb"
          dpkg-deb --build "${DEB_DIR}/${DEV_PKG_NAME}" "${DEB_DIR}/${DEV_PKG_NAME}_${PKG_VERSION}_arm64.deb"
          
          echo "artifact-name=mali-debs" >> $GITHUB_OUTPUT

      - name: Package artifacts for Armbian job
        run: |
          mkdir -p mali-artifacts
          cp mali-debs/*.deb mali-artifacts/
          # Also copy the install script template
          cp -r mali-debs mali-artifacts/

      - name: Upload Mali artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmali-${{ inputs.mali_gpu }}-${{ inputs.mali_version }}-${{ inputs.mali_platform }}-aarch64
          path: mali-artifacts/
          retention-days: 7

  # 2. Build Armbian image with Mali
  build-armbian:
    name: Build Armbian Image (Z96A)
    needs: build-mali
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Checkout Armbian os repo (contains stable.json)
        uses: actions/checkout@v4
        with:
          repository: armbian/os
          path: os
          ref: ${{ github.event.inputs.armbian_branch }}

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: momokind/armbian-build
          path: build
          ref: ${{ github.event.inputs.armbian_branch }}

      - name: Download Mali artifacts
        uses: actions/download-artifact@v4
        with:
          name: libmali-${{ inputs.mali_gpu }}-${{ inputs.mali_version }}-${{ inputs.mali_platform }}-aarch64
          path: mali-artifacts

      - name: Prepare Mali packages for Armbian build
        run: |
          # Copy Mali debs to a location accessible during build
          mkdir -p mali-repo
          cp mali-artifacts/*.deb mali-repo/
          echo "MALI_REPO_PATH=$(pwd)/mali-repo" >> $GITHUB_ENV

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap: false

      - name: Import GPG key (if provided)
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --passphrase-fd 0 --batch --yes --pinentry-mode loopback --export-secret-keys > /tmp/gpg.key

      - name: Clone Armbian OS & Build framework
        run: |
          cd os
          git submodule update --init --recursive

      - name: Prepare customisations
        run: |
          rsync -av /home/runner/work/armbian-build-sunniwell-Z96a/armbian-build-sunniwell-Z96a/custom/ build/custom/
          rsync -av /home/runner/work/armbian-build-sunniwell-Z96a/armbian-build-sunniwell-Z96a/extensions/ build/extensions/ 2>/dev/null || true

      - name: Setup Armbian version
        run: |
          BASE_VERSION=$(cat os/stable.json | jq -r '.version')
          FULL_VERSION="${BASE_VERSION}-mali-${{ inputs.mali_gpu }}-${{ inputs.mali_version }}-${{ inputs.mali_platform }}-$(date +%Y%m%d)"
          echo "ARMBIAN_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "Using ARMBIAN_VERSION: ${FULL_VERSION}"

      - name: Apply custom config & patches
        run: |
          # Create all necessary build subdirectories in build/ (where compile.sh runs)
          # Armbian looks for board configs in config/boards/ relative to build/
          mkdir -pv build/userpatches build/config/boards build/config/kernel build/config/bootenv build/config/bootscripts build/config/sources build/patch build/packages build/config/optional build/lib build/extensions
          [[ -d build/userpatches ]] && rsync -av build/userpatches/. build/userpatches/
          [[ -d build/custom/userpatches ]] && rsync -av build/custom/userpatches/. build/userpatches/
          [[ -d build/custom/config/boards ]] && rsync -av build/custom/config/boards/. build/config/boards/
          [[ -d build/custom/config/kernel ]] && rsync -av build/custom/config/kernel/. build/config/kernel/
          [[ -d build/custom/config/bootenv ]] && rsync -av build/custom/config/bootenv/. build/config/bootenv/
          [[ -d build/custom/config/bootscripts ]] && rsync -av build/custom/config/bootscripts/. build/config/bootscripts/
          [[ -d build/custom/config/sources ]] && rsync -av build/custom/config/sources/. build/config/sources/
          [[ -d build/custom/patch ]] && rsync -av build/custom/patch/. build/patch/
          [[ -d build/custom/packages ]] && rsync -av build/custom/packages/. build/packages/
          [[ -d build/custom/config/optional ]] && rsync -av build/custom/config/optional/. build/config/optional/
          [[ -d build/custom/lib ]] && rsync -av build/custom/lib/. build/lib/
          [[ -d build/custom/extensions ]] && rsync -av build/custom/extensions/. build/extensions/
          rm -fv build/patch/kernel/rockchip-rk3568-z96a/legacy/z96a-rk817.patch

      - name: Inject Mali repo & install hook
        run: |
          mkdir -p build/packages/extras-buildpkgs/mali-g52-g24p0
          cp -r ${{ env.MALI_REPO_PATH }}/* build/packages/extras-buildpkgs/mali-g52-g24p0/
          
          # Create install script using printf (avoids heredoc YAML issues)
          printf '#!/bin/bash\nset -e\necho "=== [Mali G52] Installing proprietary GPU drivers ==="\n\necho "deb [trusted=yes] file:/packages/extras-buildpkgs/mali-g52-g24p0 ./" > /etc/apt/sources.list.d/mali-local.list\napt-get update\n\nDEBIAN_FRONTEND=noninteractive apt-get install -y --allow-downgrades \\\n  libmali-bifrost-g52-g24p0-gbm \\\n  libmali-bifrost-g52-g24p0-gbm-dev 2>/dev/null || true\n\necho "=== [Mali G52] Verifying installation ==="\nls -la /usr/lib/aarch64-linux-gnu/libmali* /usr/lib/aarch64-linux-gnu/libEGL* /usr/lib/aarch64-linux-gnu/libGLESv2* /usr/lib/aarch64-linux-gnu/libgbm* 2>/dev/null || true\n\nupdate-alternatives --install /usr/lib/aarch64-linux-gnu/libEGL.so libEGL.so /usr/lib/aarch64-linux-gnu/libEGL.so.1 100 2>/dev/null || true\nupdate-alternatives --install /usr/lib/aarch64-linux-gnu/libGLESv2.so libGLESv2.so /usr/lib/aarch64-linux-gnu/libGLESv2.so.2 100 2>/dev/null || true\nupdate-alternatives --install /usr/lib/aarch64-linux-gnu/libgbm.so libgbm.so /usr/lib/aarch64-linux-gnu/libgbm.so.1 100 2>/dev/null || true\n\necho "/usr/lib/aarch64-linux-gnu" > /etc/ld.so.conf.d/mali.conf\nldconfig\n\ngroupadd -f video\ngroupadd -f render\necho "=== [Mali G52] Installation complete ==="\n' > build/packages/extras-buildpkgs/mali-g52-g24p0/install-mali.sh
          chmod +x build/packages/extras-buildpkgs/mali-g52-g24p0/install-mali.sh

      - name: Install Mali packages via hook (pre-customize)
        run: |
          # Run the Mali install script in the rootfs chroot BEFORE the main build
          # This ensures Mali is available when rockchip-multimedia extension runs
          cd build
          
          # Create a temporary customize script that runs install-mali.sh
          cat > userpatches/customize-image.sh << 'CUSTOMIZE_EOF'
          #!/bin/bash
          set -e
          
          echo "=== [Pre-customize] Installing Mali packages ==="
          
          # Copy the install script to the rootfs
          cp /packages/extras-buildpkgs/mali-g52-g24p0/install-mali.sh /tmp/install-mali.sh
          chmod +x /tmp/install-mali.sh
          
          # Run it in the chroot
          chroot / /tmp/install-mali.sh
          
          # Verify
          ls -la /usr/lib/aarch64-linux-gnu/libmali* /usr/lib/aarch64-linux-gnu/libEGL* /usr/lib/aarch64-linux-gnu/libGLESv2* /usr/lib/aarch64-linux-gnu/libgbm* 2>/dev/null || true
          
          echo "=== [Pre-customize] Mali installation complete ==="
          CUSTOMIZE_EOF
          
          chmod +x userpatches/customize-image.sh
          
          # Set CUSTOMIZE_IMAGE to run our script
          export CUSTOMIZE_IMAGE="userpatches/customize-image.sh"

      - name: Build Armbian image
        run: |
          if [[ "${{ inputs.armbian_ui }}" == minimal ]]; then
            BUILD_DESKTOP="no"
            BUILD_MINIMAL="yes"
          elif [[ "${{ inputs.armbian_ui }}" == server ]]; then
            BUILD_DESKTOP="no"
            BUILD_MINIMAL="no"
          else
            BUILD_DESKTOP="yes"
            BUILD_MINIMAL="no"
            DESKTOP_ENVIRONMENT="${{ inputs.armbian_ui }}"
            DESKTOP_APPGROUPS_SELECTED=""
            DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"
          fi

          cd build

          # Map armbian_target input to valid Armbian commands
          # "kernel" -> "kernel", "image" -> "build"
          ARMBIAN_COMMAND="${{ inputs.armbian_target }}"
          if [[ "${ARMBIAN_COMMAND}" == "image" ]]; then
            ARMBIAN_COMMAND="build"
          fi

          ./compile.sh "${ARMBIAN_COMMAND}" \
            REVISION="${{ env.ARMBIAN_VERSION }}" \
            BOARD="z96a-v2" \
            BRANCH="${{ inputs.armbian_kernel_branch }}" \
            RELEASE="${{ inputs.armbian_release }}" \
            KERNEL_CONFIGURE="no" \
            BUILD_DESKTOP="${BUILD_DESKTOP}" \
            BUILD_MINIMAL="${BUILD_MINIMAL}" \
            DESKTOP_ENVIRONMENT="${DESKTOP_ENVIRONMENT}" \
            DESKTOP_APPGROUPS_SELECTED="${DESKTOP_APPGROUPS_SELECTED}" \
            DESKTOP_ENVIRONMENT_CONFIG_NAME="${DESKTOP_ENVIRONMENT_CONFIG_NAME}" \
            ENABLE_EXTENSIONS="" \
            COMPRESS_OUTPUTIMAGE="sha,img,xz" \
            SHARE_LOG="yes" \
            EXPERT="yes"

      - name: Verify Mali in output
        run: |
          echo "=== Build completed ==="
          ls -la build/output/images/
          find build/output -name "*mali*" -type f 2>/dev/null | head -20

      - name: Release
        uses: ncipollo/release-action@v1
        if: github.event_name != 'pull_request'
        with:
          tag: ${{ env.ARMBIAN_VERSION }}
          name: "Armbian Z96A + Mali G52 ${{ inputs.mali_version }} ${{ inputs.mali_platform }}"
          artifacts: "build/output/images/*"
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Armbian for Sunniwell Z96A (RK3568) with Mali Bifrost G52 GPU drivers.
            
            **Mali Driver:** bifrost-g52-g24p0-gbm (proprietary, GBM platform)
            **Kernel:** 6.1.y (legacy) from kemp233/linux-rockchip
            **Release:** ${{ inputs.armbian_release }}
            **Desktop:** ${{ inputs.armbian_ui }}
            
            Includes:
            - libmali (wrapper + hook)
            - libEGL / libGLESv2 / libgbm
            - pkg-config files
            - Headers

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armbian-build-logs
          path: |
            build/output/debug/
            build/*.log
          retention-days: 7

