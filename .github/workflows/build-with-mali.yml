name: Build Armbian Z96A with Mali G52 (bifrost-g52-g24p0-gbm)

on:
  workflow_dispatch:
    inputs:
      armbian_release:
        description: 'Armbian release'
        type: choice
        options: [jammy, noble, bookworm]
        default: jammy
      armbian_branch:
        description: 'Armbian build framework branch'
        type: string
        default: main
      armbian_kernel_branch:
        description: 'Kernel branch'
        type: string
        default: legacy
      armbian_target:
        description: 'Build target'
        type: choice
        options: [kernel, image]
        default: image
      armbian_ui:
        description: 'Desktop environment'
        type: choice
        options: [server, minimal, xfce, kde, gnome, cinnamon]
        default: server
      mali_gpu:
        description: 'Mali GPU variant'
        type: choice
        options: [bifrost-g52, bifrost-g31, valhall-g310, valhall-g610]
        default: bifrost-g52
      mali_version:
        description: 'Mali GPU version'
        type: string
        default: g24p0
      mali_platform:
        description: 'Mali platform'
        type: choice
        options: [gbm, wayland-gbm, x11-gbm]
        default: gbm

permissions:
  contents: write

jobs:
  # 1. Cross-compile Mali G52 drivers
  build-mali:
    name: Cross-compile Mali G52
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - name: Checkout libmali-rockchip
        uses: actions/checkout@v4
        with:
          repository: kemp233/libmali-rockchip
          token: ${{ secrets.GITHUB_TOKEN }}
          path: libmali-rockchip

      - name: Configure apt sources for cross-compilation (amd64 host + arm64 target)
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null << 'SOURCES'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          sudo apt-get update

      - name: Install cross-compilation toolchain & deps
        run: |
          sudo apt-get install -y \
            crossbuild-essential-arm64 \
            pkg-config \
            libdrm-dev:arm64 \
            libgbm-dev:arm64 \
            libwayland-dev:arm64 \
            libx11-dev:arm64 \
            libxext-dev:arm64 \
            libxfixes-dev:arm64 \
            libxdamage-dev:arm64 \
            libxcb1-dev:arm64 \
            libxcb-glx0-dev:arm64 \
            libxcb-dri2-0-dev:arm64 \
            libxcb-dri3-dev:arm64 \
            libxcb-present-dev:arm64 \
            libxcb-sync-dev:arm64 \
            libxshmfence-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libglvnd-dev:arm64 \
            libegl-dev:arm64 \
            libgles-dev:arm64 \
            libgles2:arm64 \
            libegl1:arm64 \
            meson \
            ninja-build \
            git \
            python3 \
            python3-pip \
            dpkg-dev \
            debhelper \
            dh-make \
            devscripts

      - name: Install native build dependencies (for dpkg-buildpackage)
        run: |
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dh-make \
            devscripts \
            equivs \
            lintian

      - name: Verify pkg-config for cross-compile
        run: |
          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          pkg-config --version
          pkg-config --exists --print-errors libdrm gbm wayland-client wayland-server x11 xext xfixes xdamage xcb xcb-glx xcb-dri2 xcb-dri3 xcb-present xcb-sync xshmfence xxf86vm glvnd egl glesv2 || true

      - name: Create cross file
        run: |
          cat > /tmp/cross-file.txt << 'CROSS'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a55'
          endian = 'little'

          [properties]
          sys_root = '/'
          CROSS
          cat /tmp/cross-file.txt

      - name: Configure Meson
        working-directory: libmali-rockchip
        env:
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          meson setup builddir --cross-file /tmp/cross-file.txt \
            --prefix=/usr \
            --libdir=lib/aarch64-linux-gnu \
            -Dplatform=gbm \
            -Dwerror=false

      - name: Build with Ninja
        working-directory: libmali-rockchip
        env:
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          ninja -C builddir

      - name: Verify build artifacts
        working-directory: libmali-rockchip
        run: |
          echo "=== Build directory contents ==="
          ls -la builddir/
          echo "=== All .so files ==="
          find builddir -name "*.so*" -type f | head -30
          if [ -f builddir/libMali.so ] || [ -f builddir/libmali.so.1.9.0 ]; then
            echo "Found Mali libraries in builddir/"
          else
            echo "ERROR: Mali libraries not found!"
            exit 1
          fi

      - name: Create Debian packages manually (skip debian/rules meson re-run)
        id: package
        working-directory: libmali-rockchip
        run: |
          set -e
          VERSION="1.${{ inputs.mali_version }}-gbm"
          GPU="${{ inputs.mali_gpu }}"
          PLATFORM="${{ inputs.mali_platform }}"
          
          ARTIFACT_NAME="libmali-${GPU}-${VERSION}-${PLATFORM}-aarch64"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          
          PKG_DIR="${ARTIFACT_NAME}"
          rm -rf "${PKG_DIR}"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/lib/aarch64-linux-gnu"
          mkdir -p "${PKG_DIR}/usr/lib/aarch64-linux-gnu/mali-egl"
          mkdir -p "${PKG_DIR}/usr/lib/aarch64-linux-gnu/mali-gbm"
          
          LIBMALI_SRC=""
          if [ -f builddir/libMali.so ]; then
            LIBMALI_SRC="builddir/libMali.so"
          elif [ -f builddir/libmali.so.1.9.0 ]; then
            LIBMALI_SRC="builddir/libmali.so.1.9.0"
          else
            echo "ERROR: Cannot find libMali.so"
            find builddir -name "*.so*" -type f
            exit 1
          fi
          
          echo "Using library: ${LIBMALI_SRC}"
          # Create versioned library name that extension expects
          VERSIONED_NAME="libmali-bifrost-g52-g24p0-gbm.so"
          cp "${LIBMALI_SRC}" "${PKG_DIR}/usr/lib/aarch64-linux-gnu/mali-egl/${VERSIONED_NAME}"
          cp "${LIBMALI_SRC}" "${PKG_DIR}/usr/lib/aarch64-linux-gnu/mali-gbm/${VERSIONED_NAME}"
          
          cd "${PKG_DIR}/usr/lib/aarch64-linux-gnu"
          ln -sf mali-egl/${VERSIONED_NAME} libMali.so
          ln -sf libMali.so libmali.so
          ln -sf libMali.so libEGL.so
          ln -sf libMali.so libEGL.so.1
          ln -sf libMali.so libGLESv2.so
          ln -sf libMali.so libGLESv2.so.2
          ln -sf libMali.so libgbm.so
          ln -sf libMali.so libgbm.so.1
          
          cd /home/runner/work/armbian-build-sunniwell-Z96a/armbian-build-sunniwell-Z96a/libmali-rockchip
          
          cat > "${PKG_DIR}/DEBIAN/control" << CONTROL
          Package: ${ARTIFACT_NAME}
          Version: ${VERSION}
          Architecture: arm64
          Maintainer: Armbian Build <build@armbian.com>
          Description: Mali GPU userspace drivers for ${GPU} (${PLATFORM})
           This package contains the Mali GPU userspace drivers for Rockchip RK3568
           (Mali G52 bifrost) built for GBM platform.
          Section: libs
          Priority: optional
          Depends: libc6 (>= 2.31), libdrm2, libgbm1
          CONTROL
          
          cat > "${PKG_DIR}/DEBIAN/postinst" << 'POSTINST'
          #!/bin/sh
          set -e
          ldconfig
          POSTINST
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"
          
          dpkg-deb --build "${PKG_DIR}"
          
          dpkg-deb -I "${PKG_DIR}.deb"
          dpkg-deb -c "${PKG_DIR}.deb"

      - name: Package artifacts for Armbian job
        working-directory: libmali-rockchip
        run: |
          ARTIFACT_NAME="${{ steps.package.outputs.artifact-name }}"
          mkdir -p ../mali-artifacts-output
          cp "${ARTIFACT_NAME}.deb" ../mali-artifacts-output/
          ls -la ../mali-artifacts-output/

      - name: Upload Mali artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmali-${{ inputs.mali_gpu }}-${{ inputs.mali_version }}-${{ inputs.mali_platform }}-aarch64
          path: mali-artifacts-output/*.deb
          retention-days: 7

      - name: Checkout our repo for custom files
        uses: actions/checkout@v4
        with:
          path: our-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload custom files
        uses: actions/upload-artifact@v4
        with:
          name: armbian-custom
          path: |
            our-repo/custom/
            our-repo/extensions/
          retention-days: 7

  # 2. Build Armbian image with Mali packages (native ARM64 runner - no qemu needed)
  build-armbian:
    name: Build Armbian Image (Z96A)
    runs-on: ubuntu-24.04-arm
    needs: build-mali
    timeout-minutes: 120
    steps:
      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: momokind/armbian-build
          path: .
          ref: ${{ github.event.inputs.armbian_branch }}

      - name: Checkout our repo for board config
        uses: actions/checkout@v4
        with:
          repository: kemp233/armbian-build-sunniwell-Z96a
          path: z96a-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject z96a-v2 board config
        run: |
          cp z96a-repo/config/boards/z96a-v2.conf config/boards/z96a-v2.conf
          ls -la config/boards/z96a-v2.conf

      - name: Inject custom configs (boot, kernel, patches, blobs)
        run: |
          # Disable failing z96a-rk817.patch (kernel source changed, hunks don't apply)
          if [ -f "patch/kernel/rockchip-rk3568-z96a/legacy/z96a-rk817.patch" ]; then
            mv patch/kernel/rockchip-rk3568-z96a/legacy/z96a-rk817.patch \
               patch/kernel/rockchip-rk3568-z96a/legacy/z96a-rk817.patch.disabled
            echo "Disabled z96a-rk817.patch"
          fi
          # Copy custom boot scripts
          mkdir -p config/bootscripts
          cp z96a-repo/custom/config/bootscripts/boot-z96a-rk3568-laptop-v2.cmd config/bootscripts/
          
          # Copy custom bootenv
          mkdir -p config/bootenv
          cp z96a-repo/custom/config/bootenv/boot-z96a-rk3568-laptop-v2.cmd config/bootenv/ 2>/dev/null || true
          
          # Copy custom kernel config
          mkdir -p config/kernel
          cp z96a-repo/custom/config/kernel/linux-rockchip-rk3568-z96a-legacy.config config/kernel/
          
          # Copy custom family config
          mkdir -p config/sources/families
          cp z96a-repo/custom/config/sources/families/rockchip-rk3568-z96a.conf config/sources/families/
          
          # Copy custom patches
          mkdir -p patch/kernel/rockchip-rk3568-z96a/legacy/dt
          cp -r z96a-repo/patch/kernel/rockchip-rk3568-z96a/legacy/dt/*.dts patch/kernel/rockchip-rk3568-z96a/legacy/dt/ 2>/dev/null || true
          cp z96a-repo/patch/kernel/rockchip-rk3568-z96a/legacy/*.patch patch/kernel/rockchip-rk3568-z96a/legacy/ 2>/dev/null || true
          
          # Copy custom blobs
          mkdir -p packages/blobs/rk35
          cp z96a-repo/packages/blobs/rk35/rk3568_ddr_1184MHz_android5042_z96a.bin packages/blobs/rk35/ 2>/dev/null || true
          
          # Copy custom optional packages (udev rules etc)
          mkdir -p config/optional/boards
          cp -r z96a-repo/custom/config/optional/boards/z96a-v2 config/optional/boards/ 2>/dev/null || true
          
          ls -la config/boards/z96a-v2.conf
          ls -la config/bootscripts/boot-z96a-rk3568-laptop-v2.cmd
          ls -la config/kernel/linux-rockchip-rk3568-z96a-legacy.config
          ls -la config/sources/families/rockchip-rk3568-z96a.conf
          ls -la patch/kernel/rockchip-rk3568-z96a/legacy/dt/
          ls -la packages/blobs/rk35/

      - name: Checkout Armbian os repo (contains stable.json)
        uses: actions/checkout@v4
        with:
          repository: armbian/os
          path: os
          ref: ${{ github.event.inputs.armbian_branch }}

      - name: Download Mali artifacts
        uses: actions/download-artifact@v4
        with:
          name: libmali-${{ inputs.mali_gpu }}-${{ inputs.mali_version }}-${{ inputs.mali_platform }}-aarch64
          path: mali-artifacts

      - name: Download custom files
        uses: actions/download-artifact@v4
        with:
          name: armbian-custom
          path: armbian-custom

      - name: Prepare Mali packages for Armbian build
        run: |
          mkdir -p mali-repo
          cp mali-artifacts/*.deb mali-repo/
          echo "MALI_REPO_PATH=$(pwd)/mali-repo" >> $GITHUB_ENV

      - name: Prepare customisations
        run: |
          rsync -av armbian-custom/custom/ custom/
          rsync -av armbian-custom/extensions/ extensions/ 2>/dev/null || true
          # Also copy custom/extensions (rockchip-multimedia.sh is there)
          rsync -av armbian-custom/custom/extensions/ extensions/ 2>/dev/null || true
          ls -la custom/
          ls -la extensions/ 2>/dev/null || true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap: false

      - name: Import GPG key (if provided)
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --passphrase-fd 0 --batch --yes --pinentry-mode loopback --export-secret-keys > /tmp/gpg.key

      - name: Clone Armbian OS & Build framework
        run: |
          cd os
          git submodule update --init --recursive

      - name: Setup Armbian version
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Apply custom config & patches
        run: |
          if [ -d "custom/patches" ]; then
            for patch in custom/patches/*.patch; do
              [ -f "$patch" ] && patch -p1 < "$patch" || true
            done
          fi

      - name: Inject Mali repo & install hook
        run: |
          # Create local repo configuration for Mali packages
          cat > config/sources/mali-repo.list << 'SOURCES'
          deb [trusted=yes] file://${MALI_REPO_PATH} ./
          SOURCES
          
          # Create install hook for Mali packages
          mkdir -p custom/hooks
          cat > custom/hooks/install-mali.sh << 'HOOK'
          #!/bin/bash
          # Install Mali G52 packages during Armbian build
          set -e
          
          echo "Installing Mali G52 packages..."
          
          apt-get update
          
          apt-get install -y --allow-unauthenticated \
            libmali-bifrost-g52-g24p0-gbm-aarch64
          
          # The package installs libmali-bifrost-g52-g24p0-gbm.so
          # Set up update-alternatives to point to it
          update-alternatives --install /usr/lib/aarch64-linux-gnu/libEGL.so libEGL.so /usr/lib/aarch64-linux-gnu/mali-egl/libmali-bifrost-g52-g24p0-gbm.so 100
          update-alternatives --install /usr/lib/aarch64-linux-gnu/libGLESv2.so libGLESv2.so /usr/lib/aarch64-linux-gnu/mali-egl/libmali-bifrost-g52-g24p0-gbm.so 100
          update-alternatives --install /usr/lib/aarch64-linux-gnu/libgbm.so libgbm.so /usr/lib/aarch64-linux-gnu/mali-gbm/libmali-bifrost-g52-g24p0-gbm.so 100
          
          echo "Mali G52 packages installed successfully"
          HOOK
          chmod +x custom/hooks/install-mali.sh

      - name: Configure apt sources for ARM64 (native runner)
        run: |
          # The ubuntu-24.04-arm runner may have incomplete sources.list for ARM64 packages
          # Configure proper sources for native ARM64 build
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null << 'SOURCES'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          # Also ensure the main sources.list has arm64 entries
          if ! grep -q "ports.ubuntu.com" /etc/apt/sources.list 2>/dev/null; then
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
          fi
          sudo apt-get update

      - name: Install build dependencies (cmake, gcc, etc. for native ARM64 build)
        run: |
          # Wait for apt lock if another process is using it (dpkg and apt locks)
          while fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo "Waiting for apt/dpkg lock..."
            sleep 5
          done
          # Retry apt-get update up to 3 times
          for i in {1..3}; do
            if sudo apt-get update; then
              break
            fi
            echo "apt-get update failed, retrying in 10 seconds... (attempt $i/3)"
            sleep 10
          done
          sudo apt-get install -y cmake build-essential pkg-config git

      - name: Install Mali packages via hook (pre-customize)
        run: |
          echo "Mali install hook prepared at custom/hooks/install-mali.sh"
          ls -la custom/hooks/

      - name: Build Armbian image
        env:
          MALI_REPO_PATH: ${{ env.MALI_REPO_PATH }}
        run: |
          # Armbian framework needs both: BUILD_DESKTOP=yes is the switch,
          # DESKTOP_ENVIRONMENT picks the actual desktop.
          # BUILD_DESKTOP=<name> is silently ignored (no desktop installed,
          # filename gets no desktop tag), so translate the UI choice here.
          UI="${{ github.event.inputs.armbian_ui }}"
          case "$UI" in
            xfce|kde|gnome|cinnamon)
              BUILD_DESKTOP=yes
              DESKTOP_ENVIRONMENT="$UI"
              BUILD_MINIMAL=no
              ;;
            minimal)
              BUILD_DESKTOP=no
              BUILD_MINIMAL=yes
              ;;
            *)
              BUILD_DESKTOP=no
              BUILD_MINIMAL=no
              ;;
          esac

          ./compile.sh \
            BOARD=z96a-v2 \
            BRANCH=${{ github.event.inputs.armbian_kernel_branch }} \
            RELEASE=${{ github.event.inputs.armbian_release }} \
            BUILD_DESKTOP="$BUILD_DESKTOP" \
            DESKTOP_ENVIRONMENT="$DESKTOP_ENVIRONMENT" \
            BUILD_MINIMAL="$BUILD_MINIMAL" \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,gpg,xz \
            CLEAN_LEVEL=make,debs \
            EXTERNAL=yes \
            EXTERNAL_NEW=pre-built \
            INSTALL_HEADERS=no

      - name: Verify Mali in output
        run: |
          find output/ -name "*mali*" -o -name "*libMali*" | head -20
          find output/ -name "*.img" -o -name "*.img.xz" -o -name "*.img.gz" | head -10
          # The raw .img is ~2.4 GB and exceeds the 2 GiB release-asset limit;
          # make sure only the compressed .img.xz is published.
          rm -fv output/images/*.img

      - name: Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: armbian-z96a-${{ github.event.inputs.armbian_release }}-${{ github.run_number }}
          name: Armbian Z96A Mali G52 ${{ github.event.inputs.armbian_release }} #${{ github.run_number }}
          files: |
            output/images/*.img.xz
            output/images/*.img.gz
            output/images/*.sha
            output/debs/*.deb
          draft: false
          prerelease: false

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armbian-build-logs
          path: output/debug/
          retention-days: 7