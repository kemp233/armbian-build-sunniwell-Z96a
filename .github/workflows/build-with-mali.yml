name: Build Armbian Z96A with Mali G52 (bifrost-g52-g24p0-gbm)

on:
  workflow_dispatch:
    inputs:
      armbian_release:
        description: 'Armbian release'
        type: choice
        options: [bookworm, jammy, noble]
        # 板子上跑的是 bookworm, jammy 只是留着, 默认别选它
        default: bookworm
      armbian_branch:
        description: 'Armbian build framework branch'
        type: string
        default: main
      armbian_kernel_branch:
        description: 'Kernel branch'
        type: string
        default: legacy
      armbian_target:
        description: 'Build target'
        type: choice
        options: [kernel, image]
        default: image
      armbian_ui:
        description: 'Desktop environment'
        type: choice
        options: [server, minimal, xfce, kde, gnome, cinnamon]
        default: server
      mali_gpu:
        description: 'Mali GPU variant'
        type: choice
        options: [bifrost-g52, bifrost-g31, valhall-g310, valhall-g610]
        default: bifrost-g52
      mali_version:
        description: 'Mali GPU version'
        type: string
        default: g24p0
      mali_platform:
        description: 'Mali platform (each is a standalone, mutually exclusive blob)'
        type: choice
        options: [wayland-gbm, x11-gbm, gbm]
        default: wayland-gbm

permissions:
  contents: write

jobs:
  # 1. Cross-compile Mali G52 drivers
  build-mali:
    name: Cross-compile Mali G52
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - name: Checkout libmali-rockchip
        uses: actions/checkout@v4
        with:
          repository: kemp233/libmali-rockchip
          token: ${{ secrets.GITHUB_TOKEN }}
          path: libmali-rockchip

      - name: Configure apt sources for cross-compilation (amd64 host + arm64 target)
        run: |
          sudo dpkg --add-architecture arm64
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null << 'SOURCES'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          sudo apt-get update

      - name: Install cross-compilation toolchain & deps
        run: |
          # security.ubuntu.com round-robins between backends that briefly
          # disagree on freshly published packages, which surfaces as a 404
          # on a perfectly valid version. Retry the whole update+install
          # cycle so a retry re-resolves consistent indexes.
          for attempt in 1 2 3; do
            sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=5 \
                crossbuild-essential-arm64 \
            pkg-config \
            libdrm-dev:arm64 \
            libgbm-dev:arm64 \
            libwayland-dev:arm64 \
            libx11-dev:arm64 \
            libxext-dev:arm64 \
            libxfixes-dev:arm64 \
            libxdamage-dev:arm64 \
            libxcb1-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxcb-glx0-dev:arm64 \
            libwayland-client0:arm64 \
            libwayland-server0:arm64 \
            libwayland-egl1:arm64 \
            libwayland-dev:arm64 \
            libxcb-dri2-0-dev:arm64 \
            libxcb-dri3-dev:arm64 \
            libxcb-present-dev:arm64 \
            libxcb-sync-dev:arm64 \
            libxshmfence-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libglvnd-dev:arm64 \
            libegl-dev:arm64 \
            libgles-dev:arm64 \
            libgles2:arm64 \
            libegl1:arm64 \
            meson \
            ninja-build \
            git \
            python3 \
            python3-pip \
            dpkg-dev \
            debhelper \
            dh-make \
                devscripts \
              && exit 0
            echo "::warning::apt-get install failed (attempt $attempt/3), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Install native build dependencies (for dpkg-buildpackage)
        run: |
          for attempt in 1 2 3; do
            sudo apt-get install -y -o Acquire::Retries=5 \
              build-essential \
              debhelper \
              dh-make \
              devscripts \
              equivs \
              lintian \
              && exit 0
            echo "::warning::apt-get install failed (attempt $attempt/3), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Verify pkg-config for cross-compile
        run: |
          export PKG_CONFIG_PATH="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          pkg-config --version
          pkg-config --exists --print-errors libdrm gbm wayland-client wayland-server x11 xext xfixes xdamage xcb xcb-glx xcb-dri2 xcb-dri3 xcb-present xcb-sync xshmfence xxf86vm glvnd egl glesv2 || true

      - name: Create cross file
        run: |
          cat > /tmp/cross-file.txt << 'CROSS'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'cortex-a55'
          endian = 'little'

          [properties]
          sys_root = '/'
          CROSS
          cat /tmp/cross-file.txt

      - name: Configure Meson
        working-directory: libmali-rockchip
        env:
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          # Mali blob 架构必须和 SoC 匹配, 否则 eglInitialize 失败 / X 崩溃.
          # libmali-rockchip 默认 gpu=midgard-t86x (RK3399), RK3568 是 bifrost-g52.
          meson setup builddir --cross-file /tmp/cross-file.txt \
            --prefix=/usr \
            --libdir=lib/aarch64-linux-gnu \
            -Dgpu=${{ inputs.mali_gpu }} \
            -Dversion=${{ inputs.mali_version }} \
            -Dplatform=${{ inputs.mali_platform }} \
            -Dwerror=false

      - name: Build with Ninja
        working-directory: libmali-rockchip
        env:
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          ninja -C builddir

      - name: Stage installed Mali userspace
        working-directory: libmali-rockchip
        env:
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
        run: |
          set -euo pipefail
          rm -rf mali-stage
          DESTDIR="$PWD/mali-stage" meson install -C builddir --no-rebuild
          find mali-stage -maxdepth 5 -type f -o -type l | sort

      - name: Verify Mali build and installed wrappers
        working-directory: libmali-rockchip
        run: |
          set -euo pipefail
          STAGE_LIB_DIR="mali-stage/usr/lib/aarch64-linux-gnu"
          LIBMALI="$(find "$STAGE_LIB_DIR" -maxdepth 1 -type f -name 'libmali.so.*' -size +10M -print -quit)"
          if [ -z "$LIBMALI" ]; then
            echo "ERROR: real Mali G52 blob missing or smaller than 10 MiB"
            find "$STAGE_LIB_DIR" -maxdepth 1 -printf '%y %s %p\n' | sort
            exit 1
          fi
          aarch64-linux-gnu-readelf -h "$LIBMALI" | grep -E 'Class:|Machine:'
          for wrapper in libEGL.so.1 libGLESv2.so.2 libgbm.so.1; do
            test -e "$STAGE_LIB_DIR/$wrapper"
            aarch64-linux-gnu-readelf -h "$STAGE_LIB_DIR/$wrapper" >/dev/null
          done
          # wayland-gbm 平台额外需要 wayland-egl wrapper
          if [ "${{ inputs.mali_platform }}" = "wayland-gbm" ]; then
            test -e "$STAGE_LIB_DIR/libwayland-egl.so.1"
            aarch64-linux-gnu-readelf -h "$STAGE_LIB_DIR/libwayland-egl.so.1" >/dev/null
            # 光有 wrapper 不算数 —— wrapper 可能只是个空壳, 底下没有真正编进去的
            # wayland 后端。缺 EGL_KHR_platform_wayland 的话 Wayland 客户端会去用
            # Debian 自带的 libwayland-egl1, 跟 Mali 对不上, 表现就是"Wayland 下
            # GPU 加速没了"。所以查的是 blob 里有没有这个扩展, 不是文件在不在。
            if ! strings "$LIBMALI" | grep -q "EGL_KHR_platform_wayland"; then
              echo "ERROR: blob 里没有 EGL_KHR_platform_wayland, 不能当 wayland 包发"
              exit 1
            fi
            echo "Verified wayland-egl wrapper + EGL_KHR_platform_wayland for wayland-gbm"
          fi
          # 名字对内容错的包发过一次: gpu 参数没传进去, meson 用了默认值
          # gpu=midgard-t86x / version=r18p0 —— 那是 RK3288 的 Mali-T86x,
          # 不是 RK3568 的 G52。直接在 blob 里认字符串, 比看参数可靠。
          if strings "$LIBMALI" | grep -q "midgard-t86x"; then
            echo "ERROR: 打进去的是 midgard-t86x, 不是 ${{ inputs.mali_gpu }}"
            exit 1
          fi
          echo "Verified real Mali library: $LIBMALI ($(stat -c '%s' "$LIBMALI") bytes)"

      - name: Create Debian package from installed Mali userspace
        id: package
        working-directory: libmali-rockchip
        run: |
          set -euo pipefail
          VERSION="1.${{ inputs.mali_version }}-gbm"
          GPU="${{ inputs.mali_gpu }}"
          PLATFORM="${{ inputs.mali_platform }}"
          ARTIFACT_NAME="libmali-${GPU}-${VERSION}-${PLATFORM}-aarch64"
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

          STAGE_LIB_DIR="mali-stage/usr/lib/aarch64-linux-gnu"
          PKG_DIR="${ARTIFACT_NAME}"
          rm -rf "${PKG_DIR}"
          mkdir -p "${PKG_DIR}/DEBIAN" \
                   "${PKG_DIR}/etc/ld.so.conf.d" \
                   "${PKG_DIR}/usr/lib/aarch64-linux-gnu/mali-egl"

          shopt -s nullglob
          for lib in "${STAGE_LIB_DIR}"/*.so*; do
            mv "${lib}" "${PKG_DIR}/usr/lib/aarch64-linux-gnu/mali-egl/"
          done
          shopt -u nullglob

          printf '%s\n' /usr/lib/aarch64-linux-gnu/mali-egl \
            > "${PKG_DIR}/etc/ld.so.conf.d/00-z96a-mali.conf"

          cat > "${PKG_DIR}/DEBIAN/control" << CONTROL
          Package: ${ARTIFACT_NAME}
          Version: ${VERSION}
          Architecture: arm64
          Maintainer: Armbian Build <build@armbian.com>
          Provides: libmali
          Conflicts: libmali
          Replaces: libmali
          Description: Mali GPU userspace drivers for ${GPU} (${PLATFORM})
           This package contains the Rockchip Mali G52 user-space libraries and
           EGL, GLES and GBM provider wrappers used by the Z96A image.
          Section: libs
          Priority: optional
          Depends: libc6, libdrm2, libgbm1, libglvnd0
          CONTROL

          cat > "${PKG_DIR}/DEBIAN/postinst" << 'POSTINST'
          #!/bin/sh
          set -e
          ldconfig
          POSTINST
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "${PKG_DIR}"
          dpkg-deb --info "${PKG_DIR}.deb"
          dpkg-deb --contents "${PKG_DIR}.deb"

      - name: Package artifacts for Armbian job
        working-directory: libmali-rockchip
        run: |
          ARTIFACT_NAME="${{ steps.package.outputs.artifact-name }}"
          mkdir -p ../mali-artifacts-output
          cp "${ARTIFACT_NAME}.deb" ../mali-artifacts-output/
          ls -la ../mali-artifacts-output/

      - name: Upload Mali artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmali-${{ inputs.mali_gpu }}-${{ inputs.mali_version }}-${{ inputs.mali_platform }}-aarch64
          path: mali-artifacts-output/*.deb
          retention-days: 7

      - name: Checkout our repo for custom files
        uses: actions/checkout@v4
        with:
          path: our-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the Z96A desktop fix is present before upload
        run: |
          set -euo pipefail
          # 偏色/音频的修复装在 extension 目录里, 随 custom/ 一起上传。
          # 漏传的话整条修复静默消失, 而构建一路绿灯到刷机 —— 上传前就掐掉。
          E=our-repo/custom/extensions/z96a-desktop-fix
          test -f "$E/z96a-desktop-fix.sh"
          test -x "$E/overlay/usr/lib/armbian/z96a-desktop-setup"
          test -f "$E/overlay/usr/lib/systemd/system/z96a-desktop-setup.service"
          test -f "$E/overlay/var/lib/AccountsService/users/root"
          find "$E" -type f | sort | sed 's/^/  staging /'

      - name: Upload custom files
        uses: actions/upload-artifact@v4
        with:
          name: armbian-custom
          path: |
            our-repo/config/
            our-repo/patch/
            our-repo/packages/
            our-repo/extensions/
            our-repo/blobs/
            our-repo/custom/
            our-repo/userpatches/
            our-repo/lib/functions/rootfs/rootfs-create.sh
            our-repo/lib/functions/rootfs/apt-install.sh
          if-no-files-found: warn
          retention-days: 7

  # 2. Build Armbian image with Mali packages (native ARM64 runner - no qemu needed)
  build-armbian:
    name: Build Armbian Image (Z96A)
    runs-on: ubuntu-24.04-arm
    needs: build-mali
    # 抬到 240: 新增了 FFmpeg/libplacebo/mpv/mpv-handler/MPP 五个原生
    # arm64 编译, 加上原本的镜像构建, 120 分钟不够用。
    timeout-minutes: 240
    steps:
      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: momokind/armbian-build
          path: .
          ref: ${{ github.event.inputs.armbian_branch }}

      - name: Checkout our repo for board config
        uses: actions/checkout@v4
        with:
          repository: kemp233/armbian-build-sunniwell-Z96a
          path: z96a-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm repository sources
        run: |
          set -euo pipefail
          test -f z96a-repo/config/boards/z96a-v2.conf
          test -f z96a-repo/config/kernel/linux-rockchip-rk3568-z96a-legacy.config
          test -f z96a-repo/patch/kernel/rockchip-rk3568-z96a/legacy/0000.patching_config.yaml
          test -f z96a-repo/patch/u-boot/legacy/board_z96a-v2/0003-add-full-uboot-commands.patch
          test -f z96a-repo/patch/u-boot/legacy/board_z96a-v2/0004-enable-gpio3-gpio4-i2c0-saradc.patch
          test -d z96a-repo/custom/config/sources
          test -d z96a-repo/custom/extensions

      - name: Checkout Armbian os repo (contains stable.json)
        uses: actions/checkout@v4
        with:
          repository: armbian/os
          path: os
          ref: ${{ github.event.inputs.armbian_branch }}

      - name: Download Mali artifacts
        uses: actions/download-artifact@v4
        with:
          name: libmali-${{ inputs.mali_gpu }}-${{ inputs.mali_version }}-${{ inputs.mali_platform }}-aarch64
          path: mali-artifacts

      - name: Download custom files
        uses: actions/download-artifact@v4
        with:
          name: armbian-custom
          path: armbian-custom

      - name: Prepare Mali packages for Armbian build
        run: |
          set -euo pipefail
          mkdir -p extensions/mali-repo
          cp mali-artifacts/*.deb extensions/mali-repo/
          echo "MALI_REPO_PATH=$(pwd)/extensions/mali-repo" >> "$GITHUB_ENV"

      - name: Prepare complete customisations
        run: |
          set -euo pipefail
          rm -rf custom
          mkdir -p custom

          # Mirror the complete-artifact action's full repository staging chain.
          for dir in config patch packages extensions blobs; do
            if [ -d "armbian-custom/$dir" ]; then
              mkdir -p "custom/$dir"
              rsync -a "armbian-custom/$dir/" "custom/$dir/"
            fi
          done

          # Keep the newer root board/kernel configuration, while bringing in
          # the custom-only Z96A family, boot, optional, and extension files.
          #
          # "boards" and "kernel" are deliberately NOT in this list. The
          # authoritative copies are the repo's own config/boards/ and
          # config/kernel/, which were already rsync'd above by the first loop.
          # custom/config/boards/z96a-v2.conf is a historical dead copy pinned to
          # rk-6.1-rkr5.1 (= 6.1.115) and has drifted 130 lines away; merging it
          # would silently shadow the real one. Only the legacy pipeline
          # (complete-artifact-one-by-one.yml -> action.yml) reads that copy.
          for dir in bootscripts bootenv sources optional; do
            if [ -d "armbian-custom/custom/config/$dir" ]; then
              mkdir -p "custom/config/$dir"
              rsync -a "armbian-custom/custom/config/$dir/" "custom/config/$dir/"
            fi
          done
          if [ -d armbian-custom/custom/packages ]; then
            mkdir -p custom/packages
            rsync -a armbian-custom/custom/packages/ custom/packages/
          fi
          if [ -d armbian-custom/custom/extensions ]; then
            mkdir -p custom/extensions
            rsync -a armbian-custom/custom/extensions/ custom/extensions/
          fi

          if [ -d armbian-custom/userpatches ]; then
            mkdir -p custom/userpatches
            rsync -a armbian-custom/userpatches/ custom/userpatches/
          fi
          if [ -d armbian-custom/custom/userpatches ]; then
            mkdir -p custom/userpatches
            rsync -a armbian-custom/custom/userpatches/ custom/userpatches/
          fi
          for lib_file in rootfs/rootfs-create.sh rootfs/apt-install.sh; do
            if [ -f "armbian-custom/lib/functions/$lib_file" ]; then
              mkdir -p "custom/lib/functions/$(dirname "$lib_file")"
              cp "armbian-custom/lib/functions/$lib_file" "custom/lib/functions/$lib_file"
            fi
          done

          # Synchronize the staged customizations into the cloned framework.
          for dir in config patch packages extensions; do
            mkdir -p "$dir"
            rsync -a "custom/$dir/" "$dir/"
          done
          mkdir -p userpatches
          if [ -d os/userpatches ]; then
            rsync -a os/userpatches/ userpatches/
          fi
          if [ -d custom/userpatches ]; then
            rsync -a custom/userpatches/ userpatches/
          fi
          if [ -d custom/lib ]; then
            rsync -a custom/lib/ lib/
          fi
          if [ -d custom/blobs ]; then
            mkdir -p blobs
            rsync -a custom/blobs/ blobs/
          fi

          # 两个修复合在 custom/extensions/z96a-desktop-fix/ 里, 随上面那条
          # custom/extensions 的 rsync 进 extensions/, 由 extension 的
          # pre_customize_image 钩子拷进镜像根 —— 和框架自带的
          # extensions/cloud-init 同一个路子。这里**刻意不用** userpatches/
          # overlay: 那条路要求自带一份 userpatches/customize-image.sh, 而
          # armbian/os 已经有一份 (负责删 MS/VSCode/GH 软件源), 覆盖它会回归。
          #
          #   偏色 + 桌面卡顿: gdm3 was already configured for Wayland
          #     (/etc/gdm3/daemon.conf, shipped via packages/blobs/desktop/gdm),
          #     but lightdm was running instead. lightdm means X11, and the Mali
          #     userspace is a gbm-wayland build with no GLX, so X11 fell back
          #     to llvmpipe (gnome-shell burned 47% CPU while idle) and the
          #     eDP colour cast showed up on that path. The extension carries
          #     the setup unit that makes gdm3 the display manager and lets
          #     root autologin.
          #
          #   桌面没声音: the root session trips ConditionUser=!root in
          #     Debian's pipewire units, so the whole audio stack was skipped
          #     silently. The extension carries the drop-ins that clear it.

          # GitHub artifacts do not preserve Unix permission bits. Restore the
          # executable bit on every file git marks as 0755, using the z96a-repo
          # checkout as the reference. Without this, /etc/initramfs/post-update.d/99-uboot
          # lands in the bsp-cli package as 0644, run-parts silently skips it,
          # /boot/uInitrd is never created, and the board drops to the U-Boot
          # prompt with "Wrong Ramdisk Image Format" (boot failed err=-14).
          cd "$GITHUB_WORKSPACE/z96a-repo"
          # 必须同时覆盖 rsync **之后**的路径。只 chmod "../$f"(即 custom/ 下的
          # 原始位置)是不够的 —— step 8 早就把 custom/extensions/ 整个 rsync 到了
          # 框架根的 extensions/, verify 步骤断言的是 extensions/ 下那一份, 而
          # rsync 落地时权限位来自 zip 解包(一律 0644)。于是:
          #   2026-09-29 run 36557872353 就死在这里 ——
          #   `test -x extensions/z96a-desktop-fix/overlay/usr/lib/armbian/
          #    z96a-desktop-setup` 失败, 尽管 git 索引里它是 100755。
          # 一个后缀是空的 rsync 目标 ($f 去掉 custom/ 前缀) 才是 verify 真正
          # 检查的那份; 原始位置也一起补上, 供 extension 自己 exec。
          git ls-files -s | awk '$1=="100755"{print $4}' | while IFS= read -r f; do
            for target in "../$f" "../${f#custom/}"; do
              if [ -f "$target" ]; then
                chmod 755 "$target"
                echo "restored exec bit: $target"
              fi
            done
          done
          cd "$GITHUB_WORKSPACE"

          # The upstream kernel fork already contains these fixes, so the
          # patches must not be applied on top of an already-patched tree.
          #
          # They are not in our repo -- commit 91d4db731 deleted them there.
          # They come back from momokind/armbian-build, which still ships its
          # own patch/kernel/rockchip-rk3568-z96a/legacy/{z96a-rk817,z96a_cec_
          # deadlock}.patch, and the rsync above MERGES rather than replaces,
          # so the framework's copies survive. Both are part of c16c640e45a9
          # (that commit touches dw-hdmi.c by the same 4 lines).
          #
          # z96a-rk817.patch was already being removed here; z96a_cec_deadlock
          # was missed, and because the "no .patch left in legacy/" assertion
          # was written as `! find ... | grep -q .` it never fired -- set -e
          # does not trigger on a command whose status is inverted with `!`.
          for stale in z96a-rk817.patch z96a_cec_deadlock.patch; do
            rm -fv "patch/kernel/rockchip-rk3568-z96a/legacy/$stale"
          done

          test -f config/boards/z96a-v2.conf
          test -f config/kernel/linux-rockchip-rk3568-z96a-legacy.config
          test -f patch/u-boot/legacy/board_z96a-v2/0003-add-full-uboot-commands.patch
          test -f patch/u-boot/legacy/board_z96a-v2/0004-enable-gpio3-gpio4-i2c0-saradc.patch
          test -f patch/kernel/rockchip-rk3568-z96a/legacy/0000.patching_config.yaml
          test -f extensions/rockchip-multimedia.sh

      - name: Verify complete customizations and accelerator inputs
        run: |
          TRANSCRIPT="$RUNNER_TEMP/verify-transcript.txt"
          : > "$TRANSCRIPT"
          # 直接重定向到文件, **不要**用 `exec > >(tee "$TRANSCRIPT") 2>&1`。
          # 踩过的坑: 2026-09-29 的 36555222238 就是这么写的, 结果 artifact 里
          # 只有 8 行、停在 git 索引断言的 done 处, 后面全空。而那 8 行证明
          # 我的 test -x 根因判断是错的 (两个文件权限都对), 失败点在它之后 ——
          # 可是"之后"到底是哪儿, 这份日志答不了: assert_line 成功时是静默的,
          # 所以"没消息"既可能是顺利过了一串断言, 也可能是被硬杀, 两者长得
          # 一模一样。根源就是这行: bash 退出时**不等待** tee 把管道缓冲区写完,
          # 尾巴连同断言消息和退出点一起丢 —— 为了抓 bug 造的仪器自己在丢证据。
          # 代价是没有实时回显, 但下面 always() 步骤会把尾部 cat 出来, 而我们
          # 早就确认 GitHub 网页端的实时日志不可信, 真正的信源是这份文件。
          exec >"$TRANSCRIPT" 2>&1

          # 无论怎么死 —— exit 1、set -e 下的命令失败、被信号打断 —— 都要留下
          # 退出码。
          trap 'rc=$?; printf "=== verify 结束: 退出码=%s ===\n" "$rc"' EXIT

          set -euo pipefail
          # 每条命令都带行号打进 transcript。**不要**用 DEBUG/EXIT trap 去反推
          # "死在哪一行" —— 试过三种写法, 全部不可靠: BASH_LINENO[0] 在 EXIT
          # 陷阱里恒为 0; DEBUG 陷阱记录的行号会被 EXIT 陷阱自己执行的命令覆盖
          # (直接 false 报成第 1 行); 先存后关也只对函数内失败正确。set -x
          # 没有这个问题, 而且顺带把"当时到底执行了什么命令"也留下了。
          # 代价是 transcript 变长, 但它只作为 artifact 上传, 而我们已经确认
          # GitHub 的实时日志不可信, 这份文件是唯一信源 —— 长可以换确定。
          PS4='+${LINENO}: '
          set -x
          KCONFIG="config/kernel/linux-rockchip-rk3568-z96a-legacy.config"
          BOARD_CONFIG="config/boards/z96a-v2.conf"
          UBOOT_PATCH="patch/u-boot/legacy/board_z96a-v2"
          PATCH_CONFIG="patch/kernel/rockchip-rk3568-z96a/legacy/0000.patching_config.yaml"
          CHARGER="patch/kernel/rockchip-rk3568-z96a/legacy/drivers/power/supply/sc8886s_charger.c"
          MULTIMEDIA="extensions/rockchip-multimedia.sh"
          GDM_DAEMON_CONF="packages/blobs/desktop/gdm/daemon.conf"
          GNOME_DESKTOP_PKG="config/desktop/buster/environments/gnome/armbian/create_desktop_package.sh"

          # 断言助手。刻意不用 `! grep ...` 的写法:
          # bash 手册在 set -e 一节里写明, 返回值被 `!` 取反的命令
          # **不触发** errexit。所以 `! grep -q X f` 在 set -e 下永远退不出
          # 脚本 —— 它是一条装饰性的守卫, 看着在守着, 实际连一次都没生效过。
          # 本文件里曾经就有三条这种空转的断言。这里改成显式 if + 报错 +
          # exit 1, 结论不依赖 shell 对 ! 的处理。
          # 断言消息一律走 **stdout**, 不要 >&2。踩过的坑: 2026-09-29 的 CI
          # 连续两次红在 exit code 1 上, 而 `gh api .../actions/jobs/<id>/logs`
          # 返回的文本里**一条 stderr 都没有** —— 断言明明报了"缺: xxx"、
          # "模式不在 xxx 里", 日志里一个字都搜不到, 只能靠推理猜是哪条挂的,
          # 前一次就把原因猜错了 (见下面 test -x 那段的注释)。GitHub 网页端能
          # 显示 stderr, 但 API 端点不能, 而排查靠的是 API。所以全部走 stdout。

          assert_present() {
            if ! grep -qE "$1" "$2"; then
              echo "断言失败: 必需的模式 '$1' 不在 $2 里"
              exit 1
            fi
          }
          assert_absent() {
            if grep -qE "$1" "$2"; then
              echo "断言失败: 不该出现的模式 '$1' 出现在 $2 里"
              exit 1
            fi
          }

          # 和上面同样的理由: 裸 test -f 在 set -e 下失败时, 日志只有一个
          # exit code 1, 没人知道缺的是哪个文件。
          assert_exists() {
            if [ ! -e "$1" ]; then
              echo "断言失败: 必需的文件不存在: $1"
              exit 1
            fi
          }
          # 整行匹配 (kernel config 的每一项都必须占满一整行)。
          assert_line() {
            if ! grep -qxF "$1" "$2"; then
              echo "断言失败: $2 里没有整行 '$1'"
              echo "  文件当前 $(wc -l < "$2") 行, 大小 $(wc -c < "$2") 字节"
              exit 1
            fi
          }
          # 行内匹配 (任意位置出现即可)。
          assert_match() {
            if ! grep -qE "$1" "$2"; then
              echo "断言失败: '$1' 不在 $2 里"
              exit 1
            fi
          }

          assert_exists "$KCONFIG"
          assert_exists "$BOARD_CONFIG"
          assert_exists "$PATCH_CONFIG"
          assert_exists "$CHARGER"
          assert_exists "$MULTIMEDIA"
          assert_exists "$GDM_DAEMON_CONF"
          assert_exists "$GNOME_DESKTOP_PKG"
          # The greeter only reaches the GPU if the image carries both the
          # dma-heap rule and a wayland-first daemon.conf.
          assert_match '60-dma-heap-access.rules' "$MULTIMEDIA"
          assert_match '^WaylandEnable=true' "$GDM_DAEMON_CONF"
          # gdm3 owns /etc/gdm3/daemon.conf. If the desktop package ever ships
          # it again, dpkg refuses to unpack the package and the image build
          # dies with Error 100, so catch it here instead.
          assert_absent '^[^#]*(cp|install).*gdm3/daemon\.conf' "$GNOME_DESKTOP_PKG"
          assert_exists "$UBOOT_PATCH/0003-add-full-uboot-commands.patch"
          assert_exists "$UBOOT_PATCH/0004-enable-gpio3-gpio4-i2c0-saradc.patch"
          # 这三个来自框架 checkout / LFS, 不是我们 artifact 里的。任何一条
          # 缺失都会让 verify 挂掉, 而 set -e 下报错行指向这里、看不出是哪条,
          # 所以先把它们列出来 —— 挂之前就知道缺的是哪个。
          for probe in \
            packages/blobs/rk35/rk3568_ddr_1184MHz_android5042_z96a.bin \
            packages/blobs/rk35/rk3568_bl31_v1.43.elf \
            packages/bsp/common/usr/lib/armbian/armbian-apt-updates \
            packages/blobs/splash/bootsplash-packer ; do
            if [ -e "$probe" ]; then
              echo "  有: $probe"
            else
              echo "  缺: $probe"
              exit 1
            fi
          done
          # 这两个**不能**用 test -x 来验。verify 步骤面对的工作区是 artifact
          # 解包还原出来的, 而 GitHub 的 upload/download-artifact 走 zip 传输,
          # 不保留 Unix 权限位 —— 解出来的东西一律 0644。上游那个 chmod 恢复
          # 循环 (见 "restored exec bit" 那段) 是尽力而为, 它按 z96a-repo 的
          # git 索引逐个 chmod, 一旦某一步没落到这个文件上, 这里就会误报,
          # 而 set -e 下报错行只有一条 test -x, 看不出到底是权限没恢复还是
          # 文件根本不在。
          #
          # 可执行位的权威来源是 git 索引里的模式位 —— build 阶段真正拿来
          # exec 的是从 git checkout 出来的文件, 判它就该判索引, 不该判
          # 一个经过 zip 往返的临时副本。同时把实际权限打出来: 真出问题时
          # 这一行就是现场证据, 不用再去猜。
          for exe in \
            packages/bsp/common/usr/lib/armbian/armbian-apt-updates \
            packages/blobs/splash/bootsplash-packer ; do
            assert_exists "$exe"
            echo "  实际权限: $(stat -c '%A' "$exe") $exe"
            mode="$(git -C z96a-repo ls-files -s -- "$exe" | cut -d' ' -f1)"
            if [ "$mode" = "100755" ]; then
              echo "  git 索引: $mode (可执行) $exe"
            else
              echo "断言失败: $exe 在 git 索引里的模式是 '$mode', 不是 100755"
              echo "  build 阶段会 exec 它, 索引里不是可执行就是 Permission denied"
              exit 1
            fi
          done

          # 逐条报出是哪一条不满足, 而不是让第一条失败就把后面的全吞掉 ——
          # set -e 下一条 grep -qx 失败, 日志里既没有断言消息也没有文件名。
          assert_line 'CONFIG_USB_USBNET=y' "$KCONFIG"
          assert_line 'CONFIG_USB_NET_AX88179_178A=y' "$KCONFIG"
          assert_line 'CONFIG_USB_NET_CDCETHER=y' "$KCONFIG"
          assert_line 'CONFIG_USB_RTL8152=y' "$KCONFIG"
          assert_line 'CONFIG_USB_RTL8153_ECM=y' "$KCONFIG"
          assert_line 'CONFIG_RTL8852BU=m' "$KCONFIG"
          assert_line 'CONFIG_MALI_BIFROST=y' "$KCONFIG"
          # CONFIG_MALI_CSF_SUPPORT 在 G52 Bifrost 上是致命的 (commit cd45b3315),
          # 所以必须是 "# ... is not set" 而不是 "=y"。
          assert_line '# CONFIG_MALI_CSF_SUPPORT is not set' "$KCONFIG"
          assert_line 'CONFIG_DMABUF_HEAPS_ROCKCHIP=y' "$KCONFIG"
          assert_line 'CONFIG_DMABUF_HEAPS_ROCKCHIP_CMA_HEAP=y' "$KCONFIG"
          assert_line 'CONFIG_ROCKCHIP_RKNPU_DMA_HEAP=y' "$KCONFIG"
          assert_match 'CONFIG_USB_NET_AX88179_178A' "$BOARD_CONFIG"
          assert_match 'CONFIG_RTL8852BU' "$BOARD_CONFIG"
          # rkvdec@fdf80200 的 compatible 是 rockchip,rkv-decoder-rk3568, 这棵树里
          # 只有 mpp_rkvdec2.c 认它。关掉 CONFIG_ROCKCHIP_MPP_RKVDEC2 -> 节点无人
          # 绑定 -> mpp_service 不注册 VPU_CLIENT_RKVDEC -> 用户态报
          # "client 9 driver is not ready!" -> hwdec 静默退回软解, 四个 A55 跑满。
          # 2026-09-28 的 b89863e41 修的是 custom/config/boards/ 那份死副本, 本
          # workflow 根本不取, 所以修复从未进入镜像。板子配置只认 $BOARD_CONFIG。
          grep -q 'kernel_config_set_y CONFIG_ROCKCHIP_MPP_RKVDEC2' "$BOARD_CONFIG"
          assert_absent 'kernel_config_set_n[[:space:]]+CONFIG_ROCKCHIP_MPP_RKVDEC2' "$BOARD_CONFIG"
          # Z96A 的 9 个内核修复已经并进 kemp233/linux-rockchip 的 rk-6.1-rkr7.2
          # 分支 (commit c16c640e45a9), 而板配置的 KERNELBRANCH 直接指向那个
          # 分支, 所以这里不再打任何内核补丁。legacy/ 下只应剩下:
          #   0000.patching_config.yaml  —— 提供 dt/ 的 dts-directories 拷贝机制
          #   dt/  和 drivers/             —— 板级数据, 原样拷贝, 不是补丁
          # 再往这里塞 .patch 就是"同一处代码存在两份", 迟早有一份不生效。
          if find patch/kernel/rockchip-rk3568-z96a/legacy -maxdepth 1 -name '*.patch' | grep -q .; then
            echo "断言失败: legacy/ 下不该再有 .patch —— 9 个内核修复已并入 rk-6.1-rkr7.2, 再打一遍就是同一处代码两份"
            echo "  注意: 补丁可能不是来自本仓库, 而是 momokind/armbian-build 自带、又被 rsync 合并回来的"
            find patch/kernel/rockchip-rk3568-z96a/legacy -maxdepth 1 -name '*.patch' | sed 's/^/  多余的: /'
            exit 1
          fi
          test -d patch/kernel/rockchip-rk3568-z96a/legacy/dt
          grep -q 'dts-directories' "$PATCH_CONFIG"
          test ! -e patch/kernel/rockchip-rk3568-z96a/legacy/z96a-rk817.patch

          # --- 偏色 + 音频: overlay 必须在, 且内容不能被改空 ---------------
          # 这两项都曾以"已修好"的状态存在过, 实际都没进镜像。断言写死形状,
          # 下次有人删改时构建直接红, 而不是刷完机才发现又复现。
          #
          # 内容断言一律跑在**剥掉整行注释之后**的文本上。只 grep 原文的话,
          # 把一行代码删掉、却留下解释它为什么存在的那段注释, 断言照样绿 ——
          # 这个坑真的踩过一次: 2026-09-29 写的 PAM 三条断言, 全被脚本里
          # 的说明注释满足, 真正的 sed 代码删了也没人发现。
          Z96A_FIX_EXT="extensions/z96a-desktop-fix"
          DESKTOP_SETUP="$Z96A_FIX_EXT/overlay/usr/lib/armbian/z96a-desktop-setup"
          DESKTOP_FIX_SH="$Z96A_FIX_EXT/z96a-desktop-fix.sh"
          DESKTOP_SETUP_UNIT="$Z96A_FIX_EXT/overlay/usr/lib/systemd/system/z96a-desktop-setup.service"
          GNOME_PKGS="config/desktop/buster/environments/gnome/config_base/packages"

          # 这三条用会报原因的写法, 不用裸 test —— run 36557872353 就是死在
          # 上面那条裸 `test -x "$DESKTOP_SETUP"` 上, 而 set -e 下它只留一个
          # 退出码 1, 不告诉你缺的是文件还是权限位。权限位这条路尤其阴:
          # 文件在, 但从 zip 解包出来是 0644。
          assert_exists "$DESKTOP_FIX_SH"
          if [ ! -e "$DESKTOP_SETUP" ]; then
            echo "断言失败: 必需的文件不存在: $DESKTOP_SETUP"
            echo "  注意: 它在 git 索引里应是 100755, 走 extensions/ 这条 rsync 后的路径"
            exit 1
          fi
          if [ ! -x "$DESKTOP_SETUP" ]; then
            echo "断言失败: 存在但不可执行: $DESKTOP_SETUP"
            echo "  实际权限: $(stat -c '%A' "$DESKTOP_SETUP")  (期望 -rwxr-xr-x)"
            echo "  索引模式: $(git -C z96a-repo ls-files -s -- "custom/extensions/z96a-desktop-fix/overlay/usr/lib/armbian/z96a-desktop-setup" | cut -d' ' -f1)"
            echo "  成因: GitHub artifact 走 zip, 不保留 Unix 权限位; 恢复 exec 位的"
            echo "        循环必须同时覆盖 rsync 后的 extensions/ 路径, 而不只是 custom/ 下的原始位置"
            exit 1
          fi
          assert_exists "$DESKTOP_SETUP_UNIT"
          # 非注释行; code_grep 是唯一允许的入口, 杜绝再写回裸 grep
          FIX_SH_CODE="$(mktemp)"
          grep -v '^[[:space:]]*#' "$DESKTOP_FIX_SH" > "$FIX_SH_CODE"
          ext_grep() { grep -qE "$1" "$FIX_SH_CODE"; }
          # extension 自己才是把这些文件拷进镜像的那一步, 所以它本身也
          # 必须是 extension 形状: 具名 hook + 从自己的目录取数据 + 补 exec 位
          # (GitHub artifact 不保留权限位)。少了哪一样, 修复就静默不生效。
          ext_grep '^function pre_customize_image__z96a_desktop_fix\(\)'
          ext_grep 'EXTENSION_DIR'
          ext_grep 'chmod 755'
          ext_grep 'z96a-desktop-setup'
          ext_grep 'not staged into the image'
          DESKTOP_SETUP_CODE="$(mktemp)"
          grep -v '^[[:space:]]*#' "$DESKTOP_SETUP" > "$DESKTOP_SETUP_CODE"
          code_grep() { grep -qE "$1" "$DESKTOP_SETUP_CODE"; }

          # 脚本是幂等的, 但绝不能失败退出: 桌面修不好顶多退回 X11,
          # 不能把机器卡在开不了机。
          code_grep '^exit 0$'
          # PAM 那条 user != root 必须真的被改写, 否则 root 自动登录静默失败,
          # 现象是登录屏上 root 怎么都登不进去。
          code_grep 'pam_succeed_if'
          code_grep 'gdm-password'
          code_grep '^[[:space:]]*sed -i'
          # lightdm 混装是偏色和卡顿的根因, 脚本必须真的去停用它,
          # 并且把 gdm3 顶上来。
          code_grep 'dpkg-query .*lightdm'
          code_grep 'systemctl mask lightdm'
          code_grep 'systemctl enable gdm3'
          # 自动登录要有 AccountsService 那一半, 否则 gdm3 不认
          test -f "$Z96A_FIX_EXT/overlay/var/lib/AccountsService/users/root"
          grep -q '^AutomaticLoginEnable=true' "$Z96A_FIX_EXT/overlay/var/lib/AccountsService/users/root"

          # 音频: ConditionUser=!root 的 drop-in, 五个单元一个都不能少。
          # 少任何一个, 那条服务就还是 "skipped because of an unmet
          # condition check", 桌面上依旧一点声音都没有。
          for u in pipewire.socket pipewire.service pipewire-pulse.socket \
                   pipewire-pulse.service pipewire-media-session.service; do
            D="$Z96A_FIX_EXT/overlay/etc/lib/systemd/user/$u.d/z96a-root-session.conf"
            test -f "$D"
            grep -q '^ConditionUser=$' "$D"
          done

          # 音频包: pipewire-audio 一次性带上 pipewire-pulse + pipewire-alsa +
          # wireplumber, 且与 pulseaudio 互斥。单装 pulseaudio 不提供
          # /usr/bin/pipewire-pulse, 整条音频栈就静默不启动。
          grep -qx 'pipewire-audio' "$GNOME_PKGS"
          grep -qx 'pulseaudio-utils' "$GNOME_PKGS"
          assert_absent '^pulseaudio$' "$GNOME_PKGS"
          assert_absent '^pulseaudio-module-bluetooth$' "$GNOME_PKGS"
          # gdm3 早已配好 Wayland, 但历史上装过依赖 lightdm 的 xfce 桌面包,
          # 所以这个包列表里绝不能再出现 lightdm。
          grep -qx 'gdm3' "$GNOME_PKGS"
          assert_absent '^lightdm$' "$GNOME_PKGS"
          echo '偏色 (gdm3/Wayland) 与音频 (pipewire) 修复的形状已校验'

          echo 'Complete customizations and accelerator inputs verified'

      - name: Upload verify transcript
        if: always()
        run: |
          # verify 失败时这才是唯一完整的现场: 哪个断言、哪条消息、哪一行。
          if [ -s "$RUNNER_TEMP/verify-transcript.txt" ]; then
            echo "--- transcript 末尾 60 行 ---"
            tail -n 60 "$RUNNER_TEMP/verify-transcript.txt"
          else
            echo "没有 transcript 文件: verify 步骤没跑到写文件那一步"
          fi

      - name: Upload verify transcript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-transcript
          path: ${{ runner.temp }}/verify-transcript.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap: false

      - name: Import GPG key (if provided)
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --passphrase-fd 0 --batch --yes --pinentry-mode loopback --export-secret-keys > /tmp/gpg.key

      - name: Clone Armbian OS & Build framework
        run: |
          cd os
          git submodule update --init --recursive

      - name: Setup Armbian version
        run: |
          set -euo pipefail
          ARMBIAN_VERSION="$(python3 -c 'import json; print(json.load(open("os/stable.json"))["version"])')"
          echo "ARMBIAN_VERSION=$ARMBIAN_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Apply custom config & patches
        run: |
          if [ -d "custom/patches" ]; then
            for patch in custom/patches/*.patch; do
              [ -f "$patch" ] && patch -p1 < "$patch" || true
            done
          fi

      - name: Verify Mali package for image build
        run: |
          set -euo pipefail
          MALI_REPO="extensions/mali-repo"
          MALI_DEB="$(find "$MALI_REPO" -maxdepth 1 -type f -name 'libmali-*.deb' -print -quit)"
          test -n "$MALI_DEB"
          test -s "$MALI_DEB"
          dpkg-deb --info "$MALI_DEB"
          rm -rf /tmp/z96a-mali-package-check
          dpkg-deb --extract "$MALI_DEB" /tmp/z96a-mali-package-check
          LIBMALI="$(find /tmp/z96a-mali-package-check/usr/lib/aarch64-linux-gnu/mali-egl -maxdepth 1 -type f -name 'libmali.so.*' -size +10M -print -quit)"
          test -n "$LIBMALI"
          readelf -h "$LIBMALI" | grep -E 'Class:|Machine:'
          for wrapper in libEGL.so.1 libGLESv2.so.2 libgbm.so.1; do
            test -e "/tmp/z96a-mali-package-check/usr/lib/aarch64-linux-gnu/mali-egl/$wrapper"
          done
          # wayland-gbm 平台额外需要 wayland-egl wrapper
          if [ "${{ inputs.mali_platform }}" = "wayland-gbm" ]; then
            test -e "/tmp/z96a-mali-package-check/usr/lib/aarch64-linux-gnu/mali-egl/libwayland-egl.so.1"
          fi

      - name: Configure apt sources for ARM64 (native runner)
        run: |
          # The ubuntu-24.04-arm runner may have incomplete sources.list for ARM64 packages
          # Configure proper sources for native ARM64 build
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null << 'SOURCES'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          # Also ensure the main sources.list has arm64 entries
          if ! grep -q "ports.ubuntu.com" /etc/apt/sources.list 2>/dev/null; then
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
          fi
          sudo apt-get update

      - name: Install build dependencies (cmake, gcc, etc. for native ARM64 build)
        run: |
          # Wait for apt lock if another process is using it (dpkg and apt locks)
          while fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo "Waiting for apt/dpkg lock..."
            sleep 5
          done
          # Retry apt-get update up to 3 times
          for i in {1..3}; do
            if sudo apt-get update; then
              break
            fi
            echo "apt-get update failed, retrying in 10 seconds... (attempt $i/3)"
            sleep 10
          done
          install_ok=0
          for i in 1 2 3; do
            if sudo apt-get install -y cmake build-essential pkg-config git; then
              install_ok=1
              break
            fi
            echo "apt-get install failed, retrying in 10 seconds... (attempt $i/3)"
            sleep 10
          done
          [ "$install_ok" = 1 ] || exit 1

      - name: Build mpv + rkmpp FFmpeg + libplacebo (native ARM64)
        # kernel-only 的 run 不需要播放器, 白等 40 分钟。跳过。
        if: github.event.inputs.armbian_target != 'kernel'
        run: |
          set -euo pipefail

          # 全部在 CI 上编, **不要**回到板子上编。2026-09-29 的教训: 那台
          # Z96A 上跑了几个小时的 FFmpeg/mpv 编译把闪存写坏了, initrd 读出来
          # 是坏的 (U-Boot 报 "Wrong Ramdisk Image Format"), 整机开不了机,
          # 板子上手工打的 mpv 补丁和 shaderc.pc 修正一起没了。这里有原生
          # arm64 runner, 没有理由再拿设备当编译机。
          #
          # 产物进 extensions/z96a-mpv/overlay/, Armbian 构建镜像时会把它
          # 铺到 / —— 跟 z96a-desktop-fix/overlay 用的是同一套机制。
          STAGE="$PWD/extensions/z96a-mpv/overlay"
          mkdir -p "$STAGE"
          WORK="$PWD/.mpv-build"
          mkdir -p "$WORK"

          # ---- 构建依赖 -------------------------------------------------
          # 包名以 **Ubuntu noble (arm64 runner)** 为准, 不是 Debian:
          #   - `libglslang-dev` 在 noble 不存在, 是 `glslang-dev`
          #     (run 36559657755 就死在 "Unable to locate package
          #     libglslang-dev", 退出码 100)
          #   - `libfreetype6-dev` 在 noble 也没有, 是 `libfreetype-dev`
          # 每个包都对着 Launchpad noble/arm64 的索引查过再写进来, 别照搬
          # Debian 的名字。
          # libplacebo 的依赖最容易漏: 少 libxxf86vm-dev 就在 meson 那里
          # "x11present not found", 少 shaderc/glslang 就在链接那里炸。
          sudo apt-get install -y --no-install-recommends \
            nasm yasm meson ninja-build cmake pkg-config git curl ca-certificates \
            python3-mako python3-jinja2 \
            libssl-dev \
            libvulkan-dev libshaderc-dev glslang-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgbm-dev libdrm-dev \
            libx11-dev libxrandr-dev libxcb1-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxxf86vm-dev libxext-dev libxfixes-dev \
            wayland-protocols libxkbcommon-dev libwayland-dev \
            libass-dev libfreetype-dev libharfbuzz-dev libfribidi-dev \
            libvorbis-dev libopus-dev libopusfile-dev \
            libflac-dev libmpg123-dev libspeex-dev

          # ---- 版本钉死 -------------------------------------------------
          # 全部钉到具体 commit/tag, 不用分支头。上游一动这里就炸, 总比
          # 悄悄编出一个不同的东西好。
          FFMPEG_REPO=https://github.com/nyanmisaka/ffmpeg-rockchip.git
          FFMPEG_COMMIT=d90e3a1
          LIBPLACEBO_TAG=v6.338.2
          MPV_TAG=v0.38.0
          YTDLP_URL=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp

          # ---- 安装根: runner 可写, 模拟镜像的 / --------------------------
          # run 36578273991 暴露的: GitHub runner 的 /usr/local 是 root 的,
          # runner 用户写不了 —— `cmake --install` 报
          #   file INSTALL cannot make directory
          #   ".../mpp-build-prefix/include/rockchip": No such file or directory
          # 中间层 mkdir 被 EACCES 拒掉后, 最后一级才报出误导性的 ENOENT。
          # 修法不是 sudo —— sudo 装出来的东西 ownership 一团糟, 而且把构建
          # 产物灌进 runner 系统目录本来就脏。统一改成: 一切 configure 仍然
          # 用 --prefix=/usr/local (和镜像里的路径一致, .pc 内容不用改), 但
          # **安装一律加 DESTDIR=$INSTALL_ROOT**, 落到工作区里; 构建期靠
          # PKG_CONFIG_SYSROOT_DIR 把 -I/-L 重定向到 $INSTALL_ROOT 下。
          # 这也是镜像布局的真实预演: 装出来的树就是镜像里 /usr/local 的形状。
          # 构建期怎么链接到这棵树, 见下面 BUILD_PC 的注释。
          INSTALL_ROOT="$PWD/.local-root"
          mkdir -p "$INSTALL_ROOT"
          # 刻意**不用** PKG_CONFIG_SYSROOT_DIR: 它会无差别重写所有 .pc 的
          # 路径, 连系统库 (openssl/libdrm/x11, 都在 /usr) 也被指到
          # $INSTALL_ROOT/usr/... 下不存在的地方, ffmpeg 的 configure 检查
          # 反而全挂。构建期路径问题用下面的 BUILD_PC 镜像解决。
          export CFLAGS="-I$INSTALL_ROOT/usr/local/include ${CFLAGS:-}"
          export LDFLAGS="-L$INSTALL_ROOT/usr/local/lib ${LDFLAGS:-}"

          # BUILD_PC: INSTALL_ROOT 里 .pc 的构建期镜像。安装树里的 .pc 全是
          # prefix=/usr/local (镜像形状, 随镜像走, 一个字不改); 但构建时
          # pkg-config 展开成 -L/usr/local/lib 是空的, 链接必炸。镜像一份
          # 把 prefix 行重写成 $INSTALL_ROOT/usr/local, 放在 PKG_CONFIG_PATH
          # 最前面 —— 系统库不受影响 (它们不在这两个目录里), 自己编的库
          # 全部指对。
          BUILD_PC="$PWD/.pc-build"
          mkdir -p "$BUILD_PC"
          # find 的起始路径必须先 exist: 目录不存在时 find 返回 1,
          # 2>/dev/null 只藏报错不藏退出码, pipefail + set -e 会无声杀死
          # 整个 step —— run 36581861684 就这么死在 apt 装完之后, 日志里
          # 一个字都没有。
          mkdir -p "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
                   "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig"
          find "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
               "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig" \
               -name '*.pc' 2>/dev/null | while IFS= read -r f; do
            sed "s|^prefix=.*|prefix=$INSTALL_ROOT/usr/local|" "$f" > "$BUILD_PC/$(basename "$f")"
          done
          export PKG_CONFIG_PATH="$BUILD_PC:${PKG_CONFIG_PATH:-}"

          cd "$WORK"
          # ---- MPP 先行 -------------------------------------------------
          # FFmpeg 的 configure 要 pkg-config 找到 rockchip_mpp: nyanmisaka
          # 的 rkmpp 硬性要求 "rockchip_mpp >= 1.3.9" (configure:7514), 要头
          # 文件 rockchip/rk_mpi.h 和符号 mpp_create / mpp_buffer_sync_begin_f。
          # run 36575615110 就死在这里 —— MPP 构建在**下一个** step 里, 顺序
          # 反了。板上能编过是因为板上本来就有装好的 MPP, runner 上没有。
          # MPP 1.1.0 的 .pc 报 Version: 1.3.10 (pkgconfig/rockchip_mpp.pc.cmake
          # 里写死的), 满足 >= 1.3.9。版本钉死成和 rockchip-multimedia.sh
          # 一致的 1.1.0, soname 对得上, 下一步不再重编。
          if [ ! -f "$INSTALL_ROOT/usr/local/lib/pkgconfig/rockchip_mpp.pc" ]; then
            git clone --depth 1 --branch 1.1.0 \
              https://github.com/rockchip-linux/mpp.git mpp
            # MPP 的 cmake 默认会开一堆我们用不上的东西, 关掉以省时间。
            cmake -S mpp -B mpp/build -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_INSTALL_PREFIX=/usr/local \
                  -DCMAKE_INSTALL_LIBDIR=lib
            cmake --build mpp/build -j"$(nproc)"
            DESTDIR="$INSTALL_ROOT" cmake --install mpp/build
          else
            echo "MPP 已就绪, 跳过"
          fi
          # MPP 的 .pc 刚落地, 必须先刷新 BUILD_PC 再断言 —— run 36590900889
          # 的教训: MPP 装得好好的, 断言却找不到, 因为 PKG_CONFIG_PATH 里只有
          # step 开头生成的空镜像, 原始 pkgconfig 目录刻意不在搜索路径里。
          mkdir -p "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
                   "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig"
          find "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
               "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig" \
               -name '*.pc' 2>/dev/null | while IFS= read -r f; do
            sed "s|^prefix=.*|prefix=$INSTALL_ROOT/usr/local|" "$f" > "$BUILD_PC/$(basename "$f")"
          done
          echo "  BUILD_PC 镜像: $(ls "$BUILD_PC" | tr '\n' ' ')"
          # FFmpeg configure 靠 pkg-config 找 MPP (版本断言), 头文件和链接
          # 路径由上面的 CFLAGS/LDFLAGS + BUILD_PC 镜像提供。
          if ! pkg-config --exists 'rockchip_mpp >= 1.3.9'; then
            echo "断言失败: MPP 装完 pkg-config 还是找不到 rockchip_mpp >= 1.3.9"
            find "$INSTALL_ROOT/usr/local" -name 'rockchip_mpp.pc' -o -name 'librockchip_mpp*' | head -10
            exit 1
          fi
          echo "MPP: pkg-config 报 $(pkg-config --modversion rockchip_mpp), >= 1.3.9 满足"

          # ---- FFmpeg 7.1 + rkmpp ---------------------------------------
          # --enable-openssl 是**这次修的头号 bug**。之前板上编的 FFmpeg
          # 没带 TLS, ffmpeg -protocols 只有 http/httpproxy/ffrtmphttp,
          # 于是 Play with MPV 一律报 "https or dtls protocol not found",
          # 所有 B站/YouTube 链接都开不了 —— 日志第一行就是这个, 之前一直
          # 当成网络问题查, 方向完全错了。
          git clone --depth 1 "$FFMPEG_REPO" ffmpeg
          cd ffmpeg
          # fetch 只认全长 40 位 SHA, 短 SHA 直接报
          # "couldn't find remote ref d90e3a1"。之前那条 `|| true` 把这个
          # 失败吞了, 然后靠 checkout 短 SHA 碰巧落在本地对象上才没炸 ——
          # 那是运气不是逻辑。这里先解析出全长, 解析不到就大声死, 不猜。
          FULL_SHA="$(git ls-remote "$FFMPEG_REPO" | grep -m1 "^${FFMPEG_COMMIT}" | cut -f1)"
          if [ -z "$FULL_SHA" ]; then
            echo "断言失败: $FFMPEG_COMMIT 在 $FFMPEG_REPO 的任何引用里都找不到"
            echo "  (上游 rebase/revert 过的话短 SHA 会悬空, 换一个有效 commit)"
            exit 1
          fi
          git fetch --depth 1 origin "$FULL_SHA"
          git checkout --detach "$FULL_SHA"
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$FULL_SHA" ]; then
            echo "断言失败: 实际 HEAD $ACTUAL != 目标 $FULL_SHA"
            exit 1
          fi
          echo "FFmpeg 实际 checkout 到: ${ACTUAL:0:7}"
          ./configure \
            --prefix=/usr/local \
            --enable-gpl --enable-version3 \
            --enable-rkmpp --enable-libdrm \
            --enable-openssl \
            --enable-shared --disable-static \
            --disable-doc --disable-debug \
            --disable-programs
          make -j"$(nproc)"
          # DESTDIR 安装进 INSTALL_ROOT (见上面的注释)。ffmpeg 不设 rpath,
          # 跑它要靠 LD_LIBRARY_PATH 指进安装树。
          make install DESTDIR="$INSTALL_ROOT"

          # 立刻验 https 真的通了再往下走 —— 这一条不验, 后面全都白编。
          export LD_LIBRARY_PATH="$INSTALL_ROOT/usr/local/lib:${LD_LIBRARY_PATH:-}"
          if ! "$INSTALL_ROOT/usr/local/bin/ffmpeg" -hide_banner -protocols 2>/dev/null | tr ' ' '\n' | grep -qx https; then
            echo "断言失败: 编出来的 FFmpeg 仍然没有 https 协议"
            "$INSTALL_ROOT/usr/local/bin/ffmpeg" -hide_banner -protocols 2>&1 | head -20
            exit 1
          fi
          echo "FFmpeg https 协议: 已启用"
          # 同样当场验 rkmpp 真的编进去了
          if ! "$INSTALL_ROOT/usr/local/bin/ffmpeg" -hide_banner -hwaccels 2>/dev/null | grep -qx rkmpp; then
            echo "断言失败: 编出来的 FFmpeg 没有 rkmpp 硬解"
            "$INSTALL_ROOT/usr/local/bin/ffmpeg" -hide_banner -hwaccels 2>&1 | head -20
            exit 1
          fi
          echo "FFmpeg rkmpp 硬解: 已启用"
          cd "$WORK"

          # ---- shaderc 链接 --------------------------------------------
          # 在 Debian bookworm 上, 修法是: 自己拼一份 .pc, 把 glslang 的
          # 一串静态库按依赖顺序列全。**这个修法在 noble 上是死路**:
          #   - glslang 15 把 libHLSL/libOGLCompiler 合并进了 libglslang
          #   - noble 根本没有 libspirv-tools-dev —— spirv.pc 的
          #     `Requires: SPIRV-Tools` 无从满足, glslang 路线走不通
          # 所以这里改走**发行版的 libshaderc.so.1**: Ubuntu 构建它时已经把
          # glslang 和 SPIRV-Tools 静态打进了这一个 .so (libshaderc1 只依赖
          # libc/libgcc/libstdc++, 没有 libglslang 依赖, 就是证据)。
          # 这是 noble 上唯一可行的 shaderc 链接方式, 也是 libplacebo 必须
          # 钉死 `-Dshaderc=enabled -Dglslang=disabled` 的原因。
          #
          # noble 的发行版 bug 照样要补: libshaderc-dev 只发 libshaderc.a /
          # libshaderc_combined.a (而且 combined.a 并不自包含, spvtools:: 符号
          # 全是未定义引用), `shaderc.pc` 却写 `-lshaderc` —— 而 libshaderc.so
          # 这个符号链接谁都不发, 发 .so.1 的 libshaderc1 是运行时包。链接器
          # 找不到 -lshaderc。自己补上这个符号链接。
          if [ ! -e /usr/lib/aarch64-linux-gnu/libshaderc.so.1 ]; then
            echo "断言失败: /usr/lib/aarch64-linux-gnu/libshaderc.so.1 不存在"
            echo "  libshaderc1 是 libshaderc-dev 的依赖, 不该缺。检查 apt 源。"
            exit 1
          fi
          # 发行版 bug 的修法也要进 INSTALL_ROOT: /usr/local 系统目录写不了
          # (run 36578273991), 而且这份 .pc 最终就是要随镜像走的。
          # 把 libshaderc.so.1 连同缺失的 .so 符号链接一起复制进
          # $INSTALL_ROOT/usr/local/lib, shaderc.pc 的 libdir 指向同一个
          # 地方 —— 构建期 BUILD_PC 镜像指对它, 镜像里由 /usr/local/lib
          # (ld.so.conf.d) 接管, 不依赖发行版的 libshaderc1。
          mkdir -p "$INSTALL_ROOT/usr/local/lib/pkgconfig"
          cp -a /usr/lib/aarch64-linux-gnu/libshaderc.so.1 \
                "$INSTALL_ROOT/usr/local/lib/libshaderc.so.1"
          ln -sf libshaderc.so.1 "$INSTALL_ROOT/usr/local/lib/libshaderc.so"
          {
            echo 'prefix=/usr/local'
            echo 'exec_prefix=${prefix}'
            echo 'libdir=${prefix}/lib'
            echo 'includedir=${prefix}/include'
            echo ''
            echo 'Name: shaderc'
            echo 'Description: GLSL to SPIR-V compiler (shared, glslang+spvtools 已静态内含)'
            echo 'Version: 2023.8'
            echo 'Libs: -L${libdir} -lshaderc -lpthread -lstdc++ -lm'
            echo 'Cflags: -I${includedir}'
          } > "$INSTALL_ROOT/usr/local/lib/pkgconfig/shaderc.pc"
          # MPP/ffmpeg 的 DESTDIR 安装发生在上面, 此刻才有 .pc 可镜像 ——
          # 刷新 BUILD_PC, 否则链接测试找不到刚装的库。
          # find 的起始路径必须先 exist: 目录不存在时 find 返回 1,
          # 2>/dev/null 只藏报错不藏退出码, pipefail + set -e 会无声杀死
          # 整个 step —— run 36581861684 就这么死在 apt 装完之后, 日志里
          # 一个字都没有。
          mkdir -p "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
                   "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig"
          find "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
               "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig" \
               -name '*.pc' 2>/dev/null | while IFS= read -r f; do
            sed "s|^prefix=.*|prefix=$INSTALL_ROOT/usr/local|" "$f" > "$BUILD_PC/$(basename "$f")"
          done
          # 用覆盖后的 .pc 实际链接一次, 骗不了人: 找不到符号当场死。
          printf 'int main(void){return 0;}\n' > /tmp/shc-test.c
          if ! gcc /tmp/shc-test.c $(pkg-config --cflags --libs shaderc) -o /tmp/shc-test 2>/tmp/shc-test.err; then
            echo "断言失败: shaderc.pc 链接测试失败 —— .pc 内容和实际库对不上"
            cat /tmp/shc-test.err | head -15
            exit 1
          fi
          echo "shaderc.pc 链接测试通过 (BUILD_PC 镜像路径)"

          # ---- libplacebo ----------------------------------------------
          # shaderc 必须显式 enabled、glslang 必须显式 disabled。两者都是
          # auto 的话, 探测结果取决于 meson 找 .pc 的顺序 —— 而 noble 上
          # glslang 路线 (spirv.pc Requires SPIRV-Tools) 是断的, 一旦 meson
          # 选中它, 死法就是链接时一堆 spvtools 符号未定义。
          git clone --depth 1 --branch "$LIBPLACEBO_TAG" \
            https://github.com/haasn/libplacebo.git libplacebo
          cd libplacebo
          meson setup build --buildtype=release -Denable_tests=false \
            -Denable_demos=false \
            -Dshaderc=enabled -Dglslang=disabled
          # 装完当场验: shaderc 路线的源文件 spirv_shaderc.c 只有在
          # shaderc.found() 时才会进 sources (src/glsl/meson.build), 编出
          # 它的 .o 就是"真的走的 shaderc"的铁证。
          meson compile -C build
          if ! find build -name 'spirv_shaderc*.o' | grep -q .; then
            echo "断言失败: libplacebo 没有编译 spirv_shaderc —— shaderc 路线没生效"
            echo "  (glslang 路线在 noble 上是断的: 没有 SPIRV-Tools.pc)"
            echo "  meson-log 里 shaderc/glslang 的探测结果:"
            grep -iE 'shaderc|glslang' build/meson-logs/meson-log.txt | tail -8 || true
            exit 1
          fi
          echo "libplacebo 走的 shaderc 路线 (spirv_shaderc.o 已编出)"
          DESTDIR="$INSTALL_ROOT" meson install -C build
          cd "$WORK"
          # libplacebo.pc 刚落地, 刷新 BUILD_PC, mpv 才能链接到它。
          # find 的起始路径必须先 exist: 目录不存在时 find 返回 1,
          # 2>/dev/null 只藏报错不藏退出码, pipefail + set -e 会无声杀死
          # 整个 step —— run 36581861684 就这么死在 apt 装完之后, 日志里
          # 一个字都没有。
          mkdir -p "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
                   "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig"
          find "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
               "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig" \
               -name '*.pc' 2>/dev/null | while IFS= read -r f; do
            sed "s|^prefix=.*|prefix=$INSTALL_ROOT/usr/local|" "$f" > "$BUILD_PC/$(basename "$f")"
          done

          # ---- mpv 0.38 -------------------------------------------------
          # 三个补丁, 全是 FFmpeg 7.x 的 API 变更, 每一个都断言改了行数 ——
          # 上游一变 sed 没匹配上, 必须当场炸, 不能编出个看着成功、
          # 实际跑起来才崩的东西。
          git clone --depth 1 --branch "$MPV_TAG" https://github.com/mpv-player/mpv.git mpv
          cd mpv
          # (1) FF_PROFILE_* 在 FFmpeg 7 里改名成 AV_PROFILE_*。
          for f in audio/decode/ad_spdif.c demux/demux_mkv.c; do
            before=$(grep -c 'FF_PROFILE_' "$f" || true)
            [ "$before" -gt 0 ] || { echo "断言失败: $f 里没有 FF_PROFILE_ 了, 补丁该撤"; exit 1; }
            sed -i 's/\bFF_PROFILE_/AV_PROFILE_/g' "$f"
            echo "  $f: FF_PROFILE_ -> AV_PROFILE_ ($before 处)"
          done
          # (2) av_format_inject_global_side_data() 连同整个 global side data
          #     API 一起被上游删了。mpv 本来就直接从 stream side data 读
          #     DoVi 配置, 删掉这行不影响行为。
          if grep -q 'av_format_inject_global_side_data' demux/demux_lavf.c; then
            n=$(grep -c 'av_format_inject_global_side_data' demux/demux_lavf.c)
            sed -i '/av_format_inject_global_side_data(avfc);/d' demux/demux_lavf.c
            echo "  demux_lavf.c: 删掉 av_format_inject_global_side_data ($n 处)"
          else
            echo "  demux_lavf.c: 上游已经不需要这行了, 跳过"
          fi
          meson setup build \
            -Dprefix=/usr/local \
            -Dgpl=true \
            -Dlibmpv=true \
            -Dcplayer=false
          meson compile -C build
          DESTDIR="$INSTALL_ROOT" meson install -C build
          cd "$WORK"

          # ---- 装进 stage -----------------------------------------------
          # 全部从 $INSTALL_ROOT/usr/local 取 (一切安装都 DESTDIR 进了那里,
          # 见本 step 开头的注释)。树形和镜像里 /usr/local 一模一样。
          # 注意 libplacebo 在 aarch64 上是 multiarch 路径, 不是 lib/。
          for d in usr/local/bin usr/local/lib usr/local/lib/aarch64-linux-gnu \
                   usr/local/lib/pkgconfig root/.config/mpv etc/ld.so.conf.d; do
            mkdir -p "$STAGE/$d"
          done

          for b in mpv ffmpeg ffprobe; do
            if [ ! -e "$INSTALL_ROOT/usr/local/bin/$b" ]; then
              echo "断言失败: 没编出 $b"
              exit 1
            fi
            cp -a "$INSTALL_ROOT/usr/local/bin/$b" "$STAGE/usr/local/bin/"
          done
          # 库。注意 tar 保留符号链接 —— libavcodec.so.62 指向 .so.62.x.y,
          # 只 cp 一层会断链。MPP 的 librockchip_mpp* 也在 lib/ 里但**不能**
          # 带: 镜像里的 MPP 由 rockchip-multimedia.sh 提供, 带过去就是两份。
          ( cd "$INSTALL_ROOT/usr/local/lib" && find . -maxdepth 1 \
              \( -name 'libav*.so*' -o -name 'libsw*.so*' -o -name 'libshaderc.so*' \) -print0 \
              | tar --null -cf - -T - ) \
            | ( cd "$STAGE/usr/local/lib" && tar xf - )
          ( cd "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu" && find . -maxdepth 1 \
              -name 'libplacebo*' -print0 | tar --null -cf - -T - ) \
            | ( cd "$STAGE/usr/local/lib/aarch64-linux-gnu" && tar xf - )
          # 头文件和 .pc 给将来在板子上重编东西用。.pc 的 prefix 都是
          # /usr/local (configure 时定的), 和镜像里的路径一致。MPP 的
          # rockchip_*.pc 除外 —— 镜像里的 MPP 有自己的来源。
          if [ -d "$INSTALL_ROOT/usr/local/include" ]; then
            cp -a "$INSTALL_ROOT/usr/local/include" "$STAGE/usr/local/"
          fi
          if [ -d "$INSTALL_ROOT/usr/local/lib/pkgconfig" ]; then
            find "$INSTALL_ROOT/usr/local/lib/pkgconfig" -maxdepth 1 \
                 -name '*.pc' ! -name 'rockchip_*' \
                 -exec cp -a {} "$STAGE/usr/local/lib/pkgconfig/" \;
          fi

          # ldconfig 必须知道去这两个地方找, 否则 mpv 一跑就
          # "error while loading shared libraries: libplacebo.so.338"
          # heredoc 会把 YAML 块标量截断 (heredoc 体顶格 <= 块缩进),
          # 所以这里用 echo 组写文件, 全部行都留在 run 块内。
          {
            echo '/usr/local/lib'
            echo '/usr/local/lib/aarch64-linux-gnu'
          } > "$STAGE/etc/ld.so.conf.d/zz-armbian-local.conf"

          # ---- udev 提权规则 -------------------------------------------
          # VPU / Mali / HEVC / RGA 的设备节点默认是 root:root 0600, 非 root
          # 用户 (video 组成员除外) 一律打不开。桌面会话现在是 root 跑, 所以
          # 之前没暴露过; 一旦换成普通用户登录, hwdec 会静默退回软解, 日志里
          # 只有一句 dlopen 失败, 极难查。
          #
          # 为什么不直接靠 packages/bsp/rockchip/: 那个目录下确实有
          # 50-vpu.rules / 50-mali.rules / 50-hevc.rules / 60-media.rules,
          # 但 packages/bsp/ 下**只有 rockchip 一个目录**, 没有
          # rockchip-rk3568-z96a —— 而 BOARDFAMILY 正是后者。Armbian 按
          # BOARDFAMILY 找 bsp 包时能不能回落到父家族 rockchip, 没有保证。
          # 所以这里显式写一份进 overlay, 不赌那个回落。
          mkdir -p "$STAGE/etc/udev/rules.d"
          {
            echo '# MPP 视频转译层的服务节点。没有这条, 非 root 用户碰不到 VPU。'
            echo 'KERNEL=="vpu-service", MODE="0660", GROUP="video"'
            echo 'KERNEL=="mpp_service", MODE="0660", GROUP="video"'
            echo '# rkvdec2 走 stateless V4L2 暴露'
            echo 'KERNEL=="video*", MODE="0660", GROUP="video"'
            echo 'KERNEL=="media*", MODE="0660", GROUP="video"'
            echo '# Mali 渲染节点'
            echo 'KERNEL=="mali0", MODE="0660", GROUP="video"'
            echo 'KERNEL=="mali", MODE="0660", GROUP="video"'
            echo '# RGA2 缩放/格式转换'
            echo 'KERNEL=="rga", MODE="0660", GROUP="video"'
            echo '# rkvenc HEVC 编码服务'
            echo 'KERNEL=="hevc-service", MODE="0660", GROUP="video"'
          } > "$STAGE/etc/udev/rules.d/50-z96a-multimedia.rules"
          cat "$STAGE/etc/udev/rules.d/50-z96a-multimedia.rules"

          # ---- yt-dlp ---------------------------------------------------
          # 镜像里 apt 装的是 2023.03.04, 那个版本解析不了现在的 B站, 直接报
          # "Unable to extract play info"。换官方独立二进制。
          curl -fsSL -o "$STAGE/usr/local/bin/yt-dlp" "$YTDLP_URL"
          chmod +x "$STAGE/usr/local/bin/yt-dlp"
          "$STAGE/usr/local/bin/yt-dlp" --version

          # ---- 默认配置 ------------------------------------------------
          # hwdec=rkmpp 是硬解的开关。vo=gpu 走 libplacebo -> EGL -> Mali,
          # gpu-api=opengl 不能换成 vulkan: 这台板子上 Vulkan 只有 llvmpipe,
          # 换过去反而变软解。
          # heredoc 会把 YAML 块标量截断 (heredoc 体顶格 <= 块缩进),
          # 所以这里用 echo 组写文件, 全部行都留在 run 块内。
          {
            echo '# 板子上实测: 硬解 17.2% CPU, 软解 90.8%。'
            echo 'hwdec=rkmpp'
            echo 'gpu-api=opengl'
            echo 'vo=gpu'
          } > "$STAGE/root/.config/mpv/mpv.conf"

          # ---- 自检: 产物齐不齐 ----------------------------------------
          echo "=== stage 大小 ==="
          du -sh "$STAGE"
          for must in usr/local/bin/mpv usr/local/bin/ffmpeg usr/local/bin/yt-dlp \
                     root/.config/mpv/mpv.conf etc/ld.so.conf.d/zz-armbian-local.conf \
                     etc/udev/rules.d/50-z96a-multimedia.rules; do
            if [ ! -e "$STAGE/$must" ]; then
              echo "断言失败: stage 里缺 $must"
              exit 1
            fi
            echo "  有: $must"
          done
          if ! ls "$STAGE"/usr/local/lib/aarch64-linux-gnu/libplacebo.so* >/dev/null 2>&1; then
            echo "断言失败: stage 里没有 libplacebo"
            exit 1
          fi
          echo "  有: libplacebo"
          if ! ls "$STAGE"/usr/local/lib/libavcodec.so* >/dev/null 2>&1; then
            echo "断言失败: stage 里没有 libavcodec"
            exit 1
          fi
          echo "  有: libavcodec"
          if [ ! -e "$STAGE/usr/local/lib/libshaderc.so.1" ]; then
            echo "断言失败: stage 里没有 libshaderc.so.1 —— libplacebo 在镜像里会加载失败"
            exit 1
          fi
          echo "  有: libshaderc.so.1"
          # 终极断言: 逐个用 ldd 过一遍会进镜像的动态库和可执行文件,
          # 任何 "not found" 都意味着镜像里一跑就挂。镜像里唯一的库路径
          # 是 /usr/local/lib + /usr/local/lib/aarch64-linux-gnu
          # (zz-armbian-local.conf) 加上发行版自己的库, ldd 在 runner 上
          # 解析不了发行版路径之外的, 所以把 STAGE 两个目录也挂进查找路径。
          echo "=== ldd 全量核对 ==="
          export LD_LIBRARY_PATH="$STAGE/usr/local/lib:$STAGE/usr/local/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}"
          for f in "$STAGE"/usr/local/bin/mpv "$STAGE"/usr/local/bin/ffmpeg \
                   "$STAGE"/usr/local/lib/aarch64-linux-gnu/libplacebo.so*; do
            MISS=$(ldd "$f" 2>&1 | grep 'not found' || true)
            if [ -n "$MISS" ]; then
              echo "断言失败: $f 有解析不了的动态依赖:"
              echo "$MISS"
              exit 1
            fi
          done
          echo "  ldd 全部可解析"
          echo "mpv/ffmpeg/libplacebo 已备好, 待随镜像装入"

      - name: Build mpv-handler + rockchip-gstreamer-mpp (native ARM64)
        if: github.event.inputs.armbian_target != 'kernel'
        run: |
          set -euo pipefail
          STAGE="$PWD/extensions/z96a-mpv/overlay"
          WORK="$PWD/.handler-build"
          mkdir -p "$WORK"

          # ==================================================================
          # 一、mpv-handler —— "Play with MPV" 的来源
          # ==================================================================
          # 这是 Rust 项目, edition = 2024, 最低要 Rust 1.85; 而
          # ubuntu-24.04 自带的是 1.75, 直接 apt 装 rustc 会在
          # "edition2024" 上当场报错。所以必须上 rustup。
          if ! command -v cargo >/dev/null 2>&1 || \
             ! cargo --version 2>/dev/null | grep -qE '1\.(8[5-9]|9[0-9])|^cargo 1\.(1[0-9]{2})'; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          cargo --version
          rustc --version

          cd "$WORK"
          MPV_HANDLER_TAG=v0.4.2
          git clone --depth 1 --branch "$MPV_HANDLER_TAG" \
            https://github.com/akiirui/mpv-handler.git mpv-handler
          cd mpv-handler
          cargo build --release
          [ -f target/release/mpv-handler ] || {
            echo "断言失败: cargo 没产出 mpv-handler"; exit 1; }

          # 装进 stage。注意它是个**用户级**安装 (README 的 Manual installation),
          # 桌面会话是 root, 所以路径全在 root 家目录下。
          mkdir -p "$STAGE/root/.local/bin" \
                   "$STAGE/root/.local/share/applications" \
                   "$STAGE/root/.config/mpv-handler"
          cp -a target/release/mpv-handler "$STAGE/root/.local/bin/mpv-handler"
          chmod 0755 "$STAGE/root/.local/bin/mpv-handler"
          cp -a share/linux/mpv-handler.desktop \
                "$STAGE/root/.local/share/applications/mpv-handler.desktop"
          cp -a share/linux/mpv-handler-debug.desktop \
                "$STAGE/root/.local/share/applications/mpv-handler-debug.desktop"

          # mpv-handler 的配置。它的 config.toml 支持 proxy 字段 —— 这正好
          # 是"打开油管没反应"的正解: 不必去改系统级环境变量, 直接让这个
          # handler 带着代理去调 yt-dlp。上游默认的 mpv/ytdlp 都是相对路径,
          # 交给 PATH 找, 我们装的 /usr/local/bin/mpv 和 yt-dlp 就在里面。
          # echo 逐行写, 不用 heredoc: heredoc 体顶格会把 YAML 的 run 块
          # 标量截断 (后面 "proxy = ..." 那行不含缩进, 会被当成 YAML 键)。
          {
            echo '# 由 build-with-mali.yml 生成'
            echo 'mpv = "/usr/local/bin/mpv"'
            echo 'ytdl = "/usr/local/bin/yt-dlp"'
            echo 'proxy = "http://192.168.50.211:7893"'
          } > "$STAGE/root/.config/mpv-handler/config.toml"
          cat "$STAGE/root/.config/mpv-handler/config.toml"
          cd "$WORK"

          # ==================================================================
          # 二、rockchip-gstreamer-mpp
          # ==================================================================
          # 解码器换成 BoxCloudIRL 的 gstreamer-rockchip。
          #
          # 换掉 resi-labs 那份的唯一原因: 它是**因为 DMCA 被阉割**的分支,
          # README 写明不解 AV1 / H.265 / VP9, 只能解 H.264。而 B站和
          # YouTube 现在大量用 HEVC, 只解 H.264 的解码器基本没用。
          # 我逐行对比过两边的 gst_mpp_video_dec_get_mpp_type(), 差别就是
          # resi-labs 删掉的三行:
          #     video/x-h265  -> MPP_VIDEO_CodingHEVC
          #     video/x-av1   -> MPP_VIDEO_CodingAV1
          #     video/x-vp9   -> MPP_VIDEO_CodingVP9
          # BoxCloudIRL 这三行都在, 并且和 sink pad 的 caps 模板
          # (gstmppvideodec.c:65-69) 一致 —— 不是只写了个声明。
          # meson_options.txt 两边逐字相同, 所以下面的 -D 参数照搬即可。
          #
          # 两点必须心里有数:
          #   1. 这个仓库是给 **RK3588** 写的 (debian/control 里明写),
          #      而 3588 有 AV1 硬解, **3568 没有**。所以 video/x-av1 这个
          #      分支在这块板子上运行时会被 MPP 拒绝 (MPP_ERR_NOT_PERMIT),
          #      属于预期, 不是构建失败。
          #   2. 它的 encoder 只有 mppvp8enc/mpph264enc/mpph265enc/mppjpegenc,
          #      比 resi-labs 那份**少一个 H.265 编码器**。解码补全, 编码略减。
          #
          # 再次强调: **mpv 永远走不到这里**。mpv 只用 libav*, 播视频靠的是
          # FFmpeg 那条 rkmpp 通路(已在板子上实测 8.5% CPU)。换这个插件
          # 对 mpv 播放没有任何影响, 别把它的成败当成硬解的成败。
          #
          # 依赖问题: 它要 librockchip-mpp-dev, 而 Ubuntu noble 没有这个包。
          # 镜像里的 MPP 是 custom/extensions/rockchip-multimedia.sh 从源码
          # 编的 (rockchip-linux/mpp tag 1.1.0), 但那个扩展是在 compile.sh
          # 构建镜像时才跑的, 而这一步在它之前。所以这里为了让 configure 过,
          # 临时自己编一份 MPP —— **只用来链接, 不进 stage**, 避免镜像里
          # 出现两份 MPP 互相踩。版本钉死成一样的 1.1.0, soname 对得上。
          # 注意: **不能**把 librga-dev 也塞进这条命令再加 || true。
          # apt 安装是原子的 —— 列表里任何一个包定位不到, 整条命令一个都
          # 不装, 而 || true 会把这个失败吞掉, 直到 meson setup 报
          # "gstreamer-1.0 dependency not found" 才暴露, 中间隔着几分钟,
          # 根本看不出是包没装上。librga-dev 在 noble/arm64 上不存在
          # (Launchpad 索引确认), 而下面 meson 本来就 -Drga=disabled,
          # 顶层 meson.build 对 disabled 的 required:false 依赖会干净跳过,
          # 所以直接不装。
          # 这些是插件编译的硬依赖, 失败就该当场红。
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libx11-dev libdrm-dev
          # 装没装上, 当场验, 不留给 meson 的报错去猜
          for p in gstreamer-1.0 gstreamer-plugins-base-1.0 gstreamer-plugins-bad-1.0 libdrm; do
            if ! pkg-config --exists "$p"; then
              echo "断言失败: pkg-config 找不到 $p —— apt 安装没生效"
              exit 1
            fi
          done
          echo "gstreamer 开发包齐了"

          # MPP 由**上一个 step** 已经编好 (FFmpeg configure 需要它, 所以
          # 顺序在前)。这里只复用, 不重编 —— 编过一次的东西再编一遍纯属
          # 浪费, 还可能在 runner 缓存不一致时编出不同版本。
          # run 36575615110 的反面教训: 曾经把 MPP 构建放在这里、FFmpeg 在
          # 前面一步, 顺序颠倒导致 configure 找不到 rockchip_mpp >= 1.3.9。
          # 安装树和 BUILD_PC 镜像要和上一个 step 完全一致 (变量不跨 step,
          # 各自重建)。不重建的话 pkg-config 会把 -L 指到真正的
          # /usr/local —— runner 上那里是空的, 链接必炸。
          INSTALL_ROOT="$PWD/.local-root"
          BUILD_PC="$PWD/.pc-build"
          mkdir -p "$BUILD_PC"
          # find 的起始路径必须先 exist: 目录不存在时 find 返回 1,
          # 2>/dev/null 只藏报错不藏退出码, pipefail + set -e 会无声杀死
          # 整个 step —— run 36581861684 就这么死在 apt 装完之后, 日志里
          # 一个字都没有。
          mkdir -p "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
                   "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig"
          find "$INSTALL_ROOT/usr/local/lib/pkgconfig" \
               "$INSTALL_ROOT/usr/local/lib/aarch64-linux-gnu/pkgconfig" \
               -name '*.pc' 2>/dev/null | while IFS= read -r f; do
            sed "s|^prefix=.*|prefix=$INSTALL_ROOT/usr/local|" "$f" > "$BUILD_PC/$(basename "$f")"
          done
          export PKG_CONFIG_PATH="$BUILD_PC:${PKG_CONFIG_PATH:-}"
          if [ ! -f "$INSTALL_ROOT/usr/local/lib/pkgconfig/rockchip_mpp.pc" ]; then
            echo "断言失败: 上一个 step 应该已编好 MPP, 但 $INSTALL_ROOT 里没有 .pc"
            echo "  两个 step 共用同一个 MPP, 检查 step 顺序是否被改动"
            exit 1
          fi
          echo "复用上一个 step 编好的 MPP: $(pkg-config --modversion rockchip_mpp 2>/dev/null || echo '?')"

          # 钉死 commit 而不是跟 default 分支: 这个仓库没有 tag, default 分支
          # 一动, 镜像里的编解码能力就跟着变, 而 CI 不会告诉你。
          GST_MPP_URL=https://github.com/BoxCloudIRL/gstreamer-rockchip.git
          GST_MPP_COMMIT="$(git ls-remote "$GST_MPP_URL" HEAD | cut -f1)"
          echo "gstreamer-rockchip 固定到 commit $GST_MPP_COMMIT"
          git clone --depth 1 "$GST_MPP_URL" gst-rockchip
          cd gst-rockchip
          git fetch -q --depth 1 origin "$GST_MPP_COMMIT"
          git checkout -q "$GST_MPP_COMMIT"
          # 换了源就必须重新确认那三个解码分支还在。clone 到的是 shallow
          # HEAD, 拿到的是哪一版由上面那个 SHA 决定 —— 断言在这里兜底。
          DEC_SRC=gst/rockchipmpp/gstmppvideodec.c
          for pair in \
            'video/x-h265:MPP_VIDEO_CodingHEVC' \
            'video/x-av1:MPP_VIDEO_CodingAV1' \
            'video/x-vp9:MPP_VIDEO_CodingVP9' ; do
            fmt="${pair%%:*}"; sym="${pair##*:}"
            if ! grep -q "$fmt" "$DEC_SRC" || ! grep -q "$sym" "$DEC_SRC"; then
              echo "断言失败: 解码器缺少 $fmt -> $sym —— 换源后退化回只有 H.264 了"
              exit 1
            fi
            echo "  解码分支在: $fmt -> $sym"
          done
          grep -n 'video/x-h265\|video/x-av1\|video/x-vp9' "$DEC_SRC" | head -6
          # 这份 meson.build 是从 gst-plugins-bad 整份 fork 来的, 不关掉
          # auto_features 的话会连着把 bad 插件的几十个无关组件一起编,
          # 光那部分就要几十分钟。只要 rockchipmpp 这一个。
          # meson_options.txt 与 resi-labs 版逐字相同, 参数直接照搬。
          meson setup build \
            -Dauto_features=disabled \
            -Drockchipmpp=enabled \
            -Drkximage=disabled \
            -Dkmssrc=disabled \
            -Drga=disabled \
            -Dvpxalphadec=disabled
          meson compile -C build
          DESTDIR="$STAGE" meson install -C build
          cd "$WORK"

          # MPP 别混进 stage (镜像里的 MPP 由 rockchip-multimedia.sh 提供,
          # 版本同为 1.1.0)。INSTALL_ROOT 里的 MPP 不动 —— 删掉它的话下一个
          # 重试 step 就没得复用了。
          find "$STAGE" -name 'librockchip_mpp*' -print -delete || true
          find "$STAGE" -name 'rockchip_*.pc' -print -delete || true

          # ---- 自检 ------------------------------------------------------
          if [ ! -x "$STAGE/root/.local/bin/mpv-handler" ]; then
            echo "断言失败: stage 里没有 mpv-handler"; exit 1
          fi
          if [ ! -f "$STAGE/root/.config/mpv-handler/config.toml" ]; then
            echo "断言失败: stage 里没有 mpv-handler 的 config.toml"; exit 1
          fi
          echo "  有: root/.local/bin/mpv-handler"
          echo "  有: root/.config/mpv-handler/config.toml"
          if ! find "$STAGE" -name 'libgstrockchi*.so' -print -quit | grep -q .; then
            echo "断言失败: stage 里没有 gstreamer rockchipmpp 插件"
            find "$STAGE" -name 'libgst*.so' | head -10
            exit 1
          fi
          echo "  有: libgstrockchi*.so"
          echo "mpv-handler + rockchip-gstreamer-mpp 已备好"

      - name: Build Armbian image
        env:
          MALI_REPO_PATH: ${{ env.MALI_REPO_PATH }}
        run: |
          # Armbian framework needs both: BUILD_DESKTOP=yes is the switch,
          # DESKTOP_ENVIRONMENT picks the actual desktop.
          # BUILD_DESKTOP=<name> is silently ignored (no desktop installed,
          # filename gets no desktop tag), so translate the UI choice here.
          # Armbian calls its image build target "build"; keep the workflow's
          # existing user-facing "image" value as an alias.
          TARGET="${{ github.event.inputs.armbian_target }}"
          if [ "$TARGET" = "image" ]; then
            TARGET="build"
          fi

          UI="${{ github.event.inputs.armbian_ui }}"
          case "$UI" in
            xfce|kde|gnome|cinnamon)
              BUILD_DESKTOP=yes
              DESKTOP_ENVIRONMENT="$UI"
              DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"
              DESKTOP_APPGROUPS_SELECTED=""
              BUILD_MINIMAL=no
              ;;
            minimal)
              BUILD_DESKTOP=no
              BUILD_MINIMAL=yes
              ;;
            *)
              BUILD_DESKTOP=no
              BUILD_MINIMAL=no
              ;;
          esac

          ./compile.sh "$TARGET" \
            REVISION="$ARMBIAN_VERSION" \
            BOARD=z96a-v2 \
            BRANCH=${{ github.event.inputs.armbian_kernel_branch }} \
            RELEASE=${{ github.event.inputs.armbian_release }} \
            BUILD_DESKTOP="$BUILD_DESKTOP" \
            DESKTOP_ENVIRONMENT="$DESKTOP_ENVIRONMENT" \
            DESKTOP_ENVIRONMENT_CONFIG_NAME="$DESKTOP_ENVIRONMENT_CONFIG_NAME" \
            DESKTOP_APPGROUPS_SELECTED="$DESKTOP_APPGROUPS_SELECTED" \
            BUILD_MINIMAL="$BUILD_MINIMAL" \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,gpg,xz \
            CLEAN_LEVEL=make,debs \
            EXTERNAL=yes \
            EXTERNAL_NEW=pre-built \
            INSTALL_HEADERS=no \
            SHARE_LOG=yes \
            EXPERT=yes

      - name: Verify Mali in output
        if: github.event.inputs.armbian_target != 'kernel'
        run: |
          find output/ -name "*mali*" -o -name "*libMali*" | head -20
          find output/ -name "*.img" -o -name "*.img.xz" -o -name "*.img.gz" | head -10
          # The raw .img is ~2.4 GB and exceeds the 2 GiB release-asset limit;
          # make sure only the compressed .img.xz is published.
          rm -fv output/images/*.img

      - name: Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.armbian_target != 'kernel'
        with:
          tag_name: armbian-z96a-${{ github.event.inputs.armbian_release }}-${{ github.run_number }}
          name: Armbian Z96A Mali G52 ${{ github.event.inputs.armbian_release }} #${{ github.run_number }}
          files: |
            output/images/*.img.xz
            output/images/*.img.gz
            output/images/*.sha
            output/debs/*.deb
          draft: false
          prerelease: false

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armbian-build-logs
          path: output/debug/
          retention-days: 7
