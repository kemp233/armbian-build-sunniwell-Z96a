name: Build RK3576 development target
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        options: [image, kernel, uboot]
        default: image
      release:
        description: Debian release
        type: choice
        options: [bookworm]
        default: bookworm
permissions:
  contents: read
jobs:
  build:
    name: RK3576 U-Boot kernel DTB initramfs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Verify board inputs
        run: |
          set -euo pipefail
          bash -n config/boards/rk3576-dev.conf
          bash -n config/sources/families/rockchip-rk3576.conf
          test -s patch/kernel/rockchip-rk3576/legacy/dt/rk3576-dev.dts
          test -s config/kernel/linux-rockchip-rk3576-legacy.config
          for blob in bl31.elf tee.bin vendor-idblock-copy.bin; do
            test -s "packages/blobs/rockchip/rk3576/$blob"
          done
          grep -q 'rk-6.1-rkr7.2-sync-20261125' config/sources/families/rockchip-rk3576.conf
          grep -q 'rk3576-dev-20261125' config/sources/families/rockchip-rk3576.conf
          git ls-remote https://github.com/kemp233/u-boot-1.git refs/heads/rk3576-dev-20261125
          git ls-remote https://github.com/kemp233/linux-rockchip.git refs/heads/rk-6.1-rkr7.2-sync-20261125
      - name: Verify U-Boot config is non-interactive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc
          git clone --depth 1 --branch rk3576-dev-20261125 \
            https://github.com/kemp233/u-boot-1.git /tmp/rk3576-uboot-config
          make -C /tmp/rk3576-uboot-config ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- rk3576-dev_defconfig
          make -C /tmp/rk3576-uboot-config ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            TEE="$PWD/packages/blobs/rockchip/rk3576/tee.bin" \
            BL31="$PWD/packages/blobs/rockchip/rk3576/bl31.elf" \
            olddefconfig < /dev/null
          make -C /tmp/rk3576-uboot-config ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            TEE="$PWD/packages/blobs/rockchip/rk3576/tee.bin" \
            BL31="$PWD/packages/blobs/rockchip/rk3576/bl31.elf" \
            syncconfig < /dev/null
          test -s /tmp/rk3576-uboot-config/include/config/auto.conf
          test /tmp/rk3576-uboot-config/include/config/auto.conf \
            -nt /tmp/rk3576-uboot-config/.config
          grep -q '"TEE=${RKBIN_DIR}/${TEE_BLOB}"' config/sources/families/rockchip-rk3576.conf
          ! grep -q 'may-sync-config=0' config/sources/families/rockchip-rk3576.conf
      - name: Build Armbian
        run: |
          TARGET="${{ inputs.target }}"
          if [ "$TARGET" = image ]; then TARGET=build; fi
          ./compile.sh "$TARGET" \
            BOARD=rk3576-dev BRANCH=legacy RELEASE=${{ inputs.release }} \
            BUILD_DESKTOP=no BUILD_MINIMAL=yes KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,xz CLEAN_LEVEL=make,debs \
            EXTERNAL=yes EXTERNAL_NEW=pre-built INSTALL_HEADERS=no \
            ENABLE_EXTENSIONS='' EXPERT=yes
      - name: Build dual RKNPU memory-manager modules
        if: success()
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev dwarves
          git clone --depth 1 --branch rk-6.1-rkr7.2-sync-20261125 \
            https://github.com/kemp233/linux-rockchip.git /tmp/linux-rknpu
          cd /tmp/linux-rknpu
          for p in "$GITHUB_WORKSPACE"/patch/kernel/rockchip-rk3576/legacy/*.patch; do
            git apply --check "$p"
            git apply "$p"
          done
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          cp "$GITHUB_WORKSPACE/config/kernel/linux-rockchip-rk3576-legacy.config" .config
          make olddefconfig
          mkdir -p "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu"
          build_variant() {
            local mode="$1" out="$2"
            python3 - "$mode" << 'PY'
          import re, sys
          mode = sys.argv[1]
          p = '.config'
          s = open(p).read()
          for k in ('ROCKCHIP_RKNPU_DRM_GEM', 'ROCKCHIP_RKNPU_DMA_HEAP'):
              s = re.sub(r'^CONFIG_%s=.*\n' % k, '', s, flags=re.M)
              s = re.sub(r'^# CONFIG_%s is not set\n' % k, '', s, flags=re.M)
          if mode == 'gem':
              s += 'CONFIG_ROCKCHIP_RKNPU_DRM_GEM=m\n# CONFIG_ROCKCHIP_RKNPU_DMA_HEAP is not set\n'
          else:
              s += '# CONFIG_ROCKCHIP_RKNPU_DRM_GEM is not set\nCONFIG_ROCKCHIP_RKNPU_DMA_HEAP=m\n'
          open(p, 'w').write(s)
          PY
            make olddefconfig
            make -j"$(nproc)" M=drivers/rknpu clean
            make -j"$(nproc)" modules_prepare LOCALVERSION=-legacy-rockchip-rk3576
            make -j"$(nproc)" M=drivers/rknpu modules LOCALVERSION=-legacy-rockchip-rk3576
            cp drivers/rknpu/rknpu.ko "$out"
          }
          build_variant gem  "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_drm.ko"
          build_variant heap "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_heap.ko"
          cp "$GITHUB_WORKSPACE/scripts/rk3576/npu-mode-switch.sh" \
             "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/npu-mode"
          cp "$GITHUB_WORKSPACE/scripts/rk3576/npu-mode-load.sh" \
             "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/npu-mode-load"
          cp "$GITHUB_WORKSPACE/scripts/rk3576/install-npu-mode.sh" \
             "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/install-npu-mode.sh"
          cp "$GITHUB_WORKSPACE/scripts/rk3576/npu-mode.service" \
             "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/npu-mode.service"
          chmod +x "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/npu-mode" \
                   "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/npu-mode-load" \
                   "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/install-npu-mode.sh"
          # The two variants must be genuinely different modules.
          ! cmp -s "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_drm.ko" \
                   "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_heap.ko"
          modinfo -F description "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_drm.ko"
          modinfo -F description "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_heap.ko"
          # The modules must match the kernel the board is running.
          modinfo -F vermagic "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_drm.ko" \
            | grep -q '^6.1.172-legacy-rockchip-rk3576 '
          modinfo -F vermagic "$GITHUB_WORKSPACE/output/rk3576-dev/opt/rknpu/rknpu_heap.ko" \
            | grep -q '^6.1.172-legacy-rockchip-rk3576 '
      - name: Verify and collect artifacts
        if: success()
        run: |
          set -euo pipefail
          mkdir -p output/rk3576-dev
          cp -a output/debs output/rk3576-dev/ || true
          if [ -d output/images ]; then
            find output/images -maxdepth 1 -type f -name '*.img' -delete
            cp -a output/images/. output/rk3576-dev/
          fi
          find output/rk3576-dev -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          find output -type f \( -name 'u-boot.itb' -o -name 'u-boot.bin' \) -print
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rk3576-dev-${{ inputs.target }}-${{ github.run_number }}
          path: output/rk3576-dev
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk3576-dev-logs-${{ github.run_number }}
          path: output/debug
          retention-days: 14
          if-no-files-found: warn
