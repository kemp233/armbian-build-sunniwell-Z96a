# Rockchip RK3568 quad core 1-8GB SoC GBe eMMC USB3
# V2 Hardware: RK809-5 PMIC + CN3705 Charger + HUSB311 USB-C
BOARD_NAME="z96a-v2"
BOARDFAMILY="rockchip-rk3568-z96a"
BOARD_MAINTAINER="z96a-Bingo"
BOOTCONFIG="rk3568_defconfig"
#LINUXCONFIG="linux-z96a-legacy"
KERNEL_TARGET="legacy,current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3568-z96a-usb311-v2.dtb"
BOOTSCRIPT='boot-z96a-rk3568-usb311-laptop-v2.cmd:boot.cmd'
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"
BOOTFS_TYPE="fat"



function post_family_config__bluetooth_hciattach_add_bluetooth_packages() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start post_family_config__bluetooth_hciattach_add_bluetooth_packages"
	display_alert "✅✅✅✅${BOARD}" "adding vim net-tools to image..." 
	add_packages_to_image vim net-tools network-manager-openvpn-gnome


	if [[ "${RELEASE}" == "jammy" ]]; then
	if [[ "${BUILD_DESKTOP}" == "yes" ]]; then
		display_alert "✅✅✅✅${BOARD}" "adding guvcview fcitx5 to image..." 
		add_packages_to_image guvcview fcitx5 fcitx5-chinese-addons fcitx5-config-qt fcitx5-frontend-gtk4 fcitx5-frontend-gtk3 fcitx5-frontend-gtk2 im-config zenity
	fi
	fi
	
	
	
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end post_family_config__bluetooth_hciattach_add_bluetooth_packages"
}


function pre_customize_image__z96a_enbluetooth() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start pre_customize_image__z96a_enbluetooth"
	display_alert "${BOARD}" "install bluetooth firmware" 
	local TMPDIR

	# download firmware
	display_alert "✅✅✅✅${BOARD}" "git clone bluetooth firmware"
	TMPDIR=$(mktemp -d)
	pushd "${TMPDIR}" || exit 1
	git clone https://github.com/Evaneee/Armbian-software.git || exit 1
	cd Armbian-software || exit 1

	# Install the firmware and utility
	display_alert "✅✅✅✅${BOARD}" "Install the firmware..."
	mkdir -p "${SDCARD}/lib/firmware/rtl_bt"
	cp -fr bluetooth/rtl8821cs_config "${SDCARD}/lib/firmware/rtl_bt/"
	cp -fr bluetooth/rtl8821cs_fw "${SDCARD}/lib/firmware/rtl_bt/"
	cp -fr bluetooth/bt_load_rtk_firmware "${SDCARD}/usr/local/bin/"
	cp -fr bluetooth/rtk_hciattach "${SDCARD}/usr/local/bin/"
	
	cp -fr adbd "${SDCARD}/usr/local/bin/"
	cp -fr adbservice "${SDCARD}/usr/local/bin/"
	cp -fr io "${SDCARD}/usr/local/bin/"
	cp -fr jtagactive "${SDCARD}/usr/local/bin/"
	cp -fr jtaginquire "${SDCARD}/usr/local/bin/"
	

	chroot_sdcard chmod +x /usr/local/bin/{rtk_hciattach,bt_load_rtk_firmware,adbd,adbservice,io,jtagactive,jtaginquire}

	display_alert "✅✅✅✅${BOARD}" "setup bluetooth bluetooth-rtl8821cs.service..."
	# Systemd service
	cat > "${SDCARD}/etc/systemd/system/bluetooth-rtl8821cs.service" <<- EOD
		[Unit]
		Description=RTL8821CS Firmware Service
		After=network.target

		[Service]
		Type=oneshot
		ExecStart=/usr/local/bin/bt_load_rtk_firmware
		RemainAfterExit=true
		StandardOutput=journal

		[Install]
		WantedBy=multi-user.target
	EOD
	chroot_sdcard systemctl enable bluetooth-rtl8821cs.service
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end pre_customize_image__z96a_enbluetooth"
}

function pre_customize_image__z96a_ensound() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start pre_customize_image__z96a_ensound"	
	display_alert "✅✅✅✅${BOARD}" "write /etc/asound.conf..."
	cat > "${SDCARD}/etc/asound.conf" <<- EOD
		pcm.!default {
			type plug
			slave.pcm "qhw"
		}

		pcm.qhw {
			type hw
			card 1
		}

		ctl.!default {
			type hw
			card 1
		}
	EOD
	display_alert "✅✅✅✅${BOARD}" "setup amixer_enspk1.service..."
	# Systemd service
	cat > "${SDCARD}/etc/systemd/system/amixer_enspk1.service" <<- EOD
		[Unit]
		Description=amixer_enspk1 Service
		After=network.target

		[Service]
		Type=oneshot
		ExecStart=/usr/bin/amixer -c 1 set 'Playback Path' SPK
		RemainAfterExit=true
		StandardOutput=journal

		[Install]
		WantedBy=multi-user.target
	EOD
	chroot_sdcard systemctl enable amixer_enspk1.service
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end pre_customize_image__z96a_ensound"
}


function post_family_tweaks__z96a_enable_ppa() {

	if [[ "${RELEASE}" == "jammy" ]]; then
	if [[ "${BUILD_DESKTOP}" == "yes" ]]; then
		display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start post_family_tweaks__z96a_enable_ppa"
		display_alert "Adding qcom-mainline PPA" "${BOARD}" "info"
		do_with_retries 3 chroot_sdcard add-apt-repository ppa:liujianfeng1994/rockchip-multimedia  --yes
		do_with_retries 3 chroot_sdcard apt dist-upgrade --yes
		do_with_retries 3 chroot_sdcard apt install rockchip-multimedia-config
		do_with_retries 3 chroot_sdcard apt install ffmpeg chromium-browser{,-l10n} chromium-codecs-ffmpeg-extra --yes
		display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end post_family_tweaks__z96a_enable_ppa"
	fi
	fi
	return 0
}




















function post_customize_image__z96a_wifi_autoconnect() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start post_customize_image__z96a_wifi_autoconnect"
	display_alert "${BOARD}" "Configuring WiFi auto-connect for SSID: 2333666"

	# Create NetworkManager system connection profile (pre-shared key)
	cat > "${SDCARD}/etc/NetworkManager/system-connections/2333666.nmconnection" <<- EONM
		[connection]
		id=2333666
		uuid=$(uuidgen)
		type=wifi
		interface-name=wlan0
		autoconnect-priority=100
		permissions=

		[wifi]
		mode=infrastructure
		ssid=2333666

		[wifi-security]
		auth-alg=open
		key-mgmt=wpa-psk
		psk=enenredick233

		[ipv4]
		method=auto

		[ipv6]
		method=auto
		addr-gen-mode=stable-privacy
	EONM

	# Secure the connection file (must be 600, owned by root)
	chroot_sdcard chmod 600 /etc/NetworkManager/system-connections/2333666.nmconnection
	chroot_sdcard chown root:root /etc/NetworkManager/system-connections/2333666.nmconnection

	# Ensure NetworkManager waits for connectivity at boot
	chroot_sdcard systemctl enable NetworkManager-wait-online.service

	# Create a oneshot service to announce IP on serial console after network is up
	cat > "${SDCARD}/etc/systemd/system/z96a-announce-ip.service" <<- 'EOSVC'
		[Unit]
		Description=Announce IP Address on Serial Console
		After=network-online.target
		Wants=network-online.target

		[Service]
		Type=oneshot
		ExecStart=/bin/sh -c 'for i in $(seq 1 30); do IP=$(ip addr show wlan0 2>/dev/null | grep "inet " | awk "{print \$2}" | cut -d/ -f1); if [ -n "$IP" ]; then echo "===========================================" > /dev/ttyFIQ0; echo " Z96A V2 ONLINE - IP: $IP" > /dev/ttyFIQ0; echo " SSH: ssh root@$IP" > /dev/ttyFIQ0; echo "===========================================" > /dev/ttyFIQ0; break; fi; sleep 2; done'
		StandardOutput=journal

		[Install]
		WantedBy=multi-user.target
	EOSVC

	chroot_sdcard systemctl enable z96a-announce-ip.service

	display_alert "✅✅✅✅${BOARD}" "WiFi auto-connect configured (SSID: 2333666)"
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end post_customize_image__z96a_wifi_autoconnect"
}
