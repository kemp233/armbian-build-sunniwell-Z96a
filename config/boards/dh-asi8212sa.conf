# Dahua DH-ASI8212SA — RK3568 door-station board
#
# Board data extracted from the factory U-Boot DTB (recovered from the
# uboot partition; decompiled at dh/flash_kit/uboot_config.dts):
#   - eMMC on sdhci@fe310000 (HS200 8-bit 200MHz)
#   - SD on sdmmc0@fe2b0000, TF on sdmmc1@fe2c0000
#   - GMAC0/GMAC1 RGMII with factory tx/rx delays (0x3c/0x2f, 0x4f/0x26)
#   - OTP-fuse block secure_otp@fe3a0000 (efuse @0xfe880000)
#   - Recovery key: SARADC ch0 pressed < 9uV
#   - PMIC on private I2C (no in-DT PMIC; rails at reset defaults)
#
# Boot chain: kemp233/u-boot-1@rockchip-v2026.01 (dh-asi8212sa_defconfig,
# board/rockchip/dh_asi8212sa_rk3568/) + kemp233/linux-rockchip@rk-6.1-rkr7.2
#
BOARD_NAME="dh-asi8212sa"
BOARDFAMILY="rockchip-rk3568-dh"
BOARD_MAINTAINER="z96a-kemp"

# Fully self-contained DH defconfig (CONFIG_TARGET_DH_ASI8212SA,
# board/rockchip/dh_asi8212sa_rk3568/) — does not reference z96a.
BOOTCONFIG="dh-asi8212sa-rk3568_defconfig"
BOOT_FDT_FILE="rockchip/rk3568-dh-asi8212sa.dtb"

LINUXCONFIG="linux-rockchip-rk3568-dh-legacy"
KERNEL_TARGET="legacy"

# Dedicated DH bootscript (no PMIC I2C hacks).
BOOTSCRIPT='boot-dh-asi8212sa.cmd:boot.cmd'
FORCE_BOOTSCRIPT_UPDATE="yes"

IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"
BOOTFS_TYPE="fat"

# ---- DDR / BL31 blobs (rockchip-linux rkbin) ----
# 1056MHz production DDR blob: the proven-working TPL for this board
# (rk356x_spl_loader_ddr1056_v1.10.111.bin = same DDR init).
DDR_BLOB="rk35/rk3568_ddr_1056MHz_v1.10.bin"
BL31_BLOB="bin/rk35/rk3568_bl31_v1.46.elf"

RKBIN_GIT_URL="https://github.com/rockchip-linux/rkbin.git"
RKBIN_GIT_BRANCH="master"

# binman (u-boot-1 v2026.01) needs pyelftools to read BL31.elf
function add_host_dependencies__dh_pyelftools_for_binman() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}

# ---- Custom kernel: kemp233/linux-rockchip rk-6.1-rkr7.2 (same as lb2004) ----
function post_family_config_branch_legacy__dh_custom_kernel() {
	declare -g KERNEL_MAJOR_MINOR="6.1"
	declare -g KERNELBRANCH='branch:rk-6.1-rkr7.2'
	declare -g KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
	declare -g LINUXCONFIG='linux-rockchip-rk3568-dh-legacy'
	display_alert "Using kemp233/linux-rockchip 6.1.y (rkr7.2) kernel for" "${BOARD}" "info"
}

# ---- binman flash.bin target map (u-boot-1 v2026.01) ----
function post_family_config__dh_uboot_v2026_target_map() {
	display_alert "dh-asi8212sa" "override UBOOT_TARGET_MAP for u-boot-1 binman" "info"
	UBOOT_TARGET_MAP="ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB} spl/u-boot-spl u-boot.bin flash.bin;;idbloader.img u-boot.itb"
	display_alert "dh-asi8212sa" "UBOOT_TARGET_MAP=${UBOOT_TARGET_MAP}" "info"
}

# ---- Keep only the DH DTB in /boot (256MB FAT32 boot partition) ----
function pre_customize_image__dh_strip_extra_dtbs() {
	display_alert "dh-asi8212sa" "stripping non-DH DTBs from /boot" "info"
	local dtb_dir="${SDCARD}/boot/dtb/rockchip"
	if [[ -d "${dtb_dir}" ]]; then
		local kept=0 removed=0
		while IFS= read -r -d '' f; do
			local base="$(basename "${f}")"
			if [[ "${base}" == rk3568-dh-*.dtb || "${base}" == rk3568-dh-*.dtbo ]]; then
				kept=$((kept + 1))
			else
				rm -f "${f}"
				removed=$((removed + 1))
			fi
		done < <(find "${dtb_dir}" -maxdepth 1 -type f -print0)
		display_alert "dh-asi8212sa" "dtb cleanup: kept ${kept}, removed ${removed}" "info"
	fi
}
