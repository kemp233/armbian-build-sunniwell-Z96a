# Rockchip RK3566 quad core SoC with 1-8GB LPDDR4, GBe, USB3, eMMC
# Board: Sunwintac SW-001 / ophub LB2004 / Skyworth LB2004-A4091
# SoC:   Rockchip RK3566 (die-shrink of RK3568; same SoC IP block, same driver code)
# WiFi:  AP6212 (BCM43436, SDIO) — but user uses RTL8812CS externally via USB? Recheck
# BT:    UART1
# PMIC:  RK809
# ETH:   GMAC1 (RGMII) + external 125MHz clock — no PHY on-board, requires external PHY
#
# Source: ophub/amlogic-s9xxx-armbian lb2004-rebase (DTS ported in 89cd34c5d)
#         kemp233/u-boot-1@rockchip-v2026.01 (U-Boot)
#         kemp233/linux-rockchip@rk-6.1-rkr5.1 (kernel)
#
# Key change vs prior version: this conf now declares a proper RK3566 identity
# (BOOTCONFIG=lb2004-rk3566_defconfig, DDR_BLOB=rk3566_*, BOOT_SOC=rk3566).
# Previously it was a "z96a rebrand" — that worked but misidentified the SoC.

BOARD_NAME="lb2004-rk3566"
BOARDFAMILY="rockchip-rk3568-z96a"
BOARD_MAINTAINER="z96a-kemp"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"

# ---- SoC / CPU identification (drives CPUMAX) ----
# rockchip64_common.inc sets CPUMAX based on BOOT_SOC:
#   rk3566 → 1800000 (1.8GHz max, matches lb2004 hardware)
#   rk3568 → 1992000 (1.992GHz max, applies to z96a but NOT lb2004)
# rk3566 is a die-shrink of rk3568; same ARM cores, max freq 1.8GHz vs 2.0GHz.
declare -g BOOT_SOC="rk3566"

# ---- U-Boot ----
# Use kemp233/u-boot-1's lb2004-rk3566_defconfig (rk3566 device tree, evb_rk3568
# board framework). kemp233's defconfig is missing CONFIG_TARGET_EVB_RK3568=y;
# added by pre_config_uboot_target__lb2004_rk3566_add_target below.
# (Previously this was a per-board u-boot patch, but armbian's Python patcher
#  flagged it as "not mbox" and refused to apply it on the GHA runner.)
BOOTCONFIG="lb2004-rk3566_defconfig"
BOOT_FDT_FILE="rockchip/rk3566-lb2004.dtb"

# ---- Kernel ----
LINUXCONFIG="linux-rockchip-rk3568-z96a-legacy"
KERNEL_TARGET="legacy"
KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'

# ---- Boot script ----
# Use standard rockchip64 boot script (lb2004 has no vdd_npu I2C hack like z96a
# because its NPU voltage is set in the BSP kernel rk3566.dtsi, not via RK809).
BOOTSCRIPT='boot-rockchip64.cmd:boot.cmd'

# ---- Image layout ----
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"
BOOTFS_TYPE="fat"

# ---- DDR / BL31 blobs ----
# Use RK3566-specific DDR init blob (1056MHz LPDDR4, matches lb2004 hardware —
# the running lb2004 reports `&lpddr4x_params { freq_0 = <1056>; }`).
# kemp233 z96a uses 1184MHz which is wrong for rk3566 — it would fail DRAM init
# on lb2004 (different DRAM training and PHY).
DDR_BLOB="rk35/rk3566_ddr_1056MHz_D4_LP4_4x_eyescan_v1.25.bin"
# BL31: rkbin has no rk3566-specific BL31 (rk3566 shares trustzone with rk3568).
# z96a's rk3568_bl31_v1.46.elf works for both SoCs. DO NOT switch unless a
# rk3566 BL31 is published.
BL31_BLOB="bin/rk35/rk3568_bl31_v1.46.elf"

# ---- rkbin (rockchip official blob repo) ----
RKBIN_GIT_URL="https://github.com/rockchip-linux/rkbin.git"
RKBIN_GIT_BRANCH="master"

# ---- binman (kemp233/u-boot-1@rockchip-v2026.01) needs pyelftools ----
function add_host_dependencies__lb2004_pyelftools_for_binman() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}

# ---- Custom kernel (kemp233/linux-rockchip rk-6.1-rkr5.1) ----
function post_family_config_branch_legacy__lb2004_custom_kernel() {
	declare -g KERNEL_MAJOR_MINOR="6.1"
	declare -g KERNELBRANCH='branch:rk-6.1-rkr5.1'
	declare -g KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
	declare -g LINUXCONFIG='linux-rockchip-rk3568-z96a-legacy'
	display_alert "Using kemp233/linux-rockchip 6.1.y kernel for" "${BOARD}" "info"
}

# ---- Override UBOOT_TARGET_MAP for kemp233/u-boot-1@rockchip-v2026.01 (binman flash.bin) ----
# Mirrors z96a-v2's post_family_config__z96a_uboot_v2026_target_map, but with
# rk3566 DDR blob. Without this, armbian's UBOOT_TARGET_MAP (set by
# rockchip64_common.inc) tries to build "idbloader.bin uboot.img trust.bin"
# which doesn't exist in the v2026.01 binman flow.
function post_family_config__lb2004_uboot_v2026_target_map() {
	display_alert "lb2004" "override UBOOT_TARGET_MAP for u-boot-1 binman" "info"
	UBOOT_TARGET_MAP="ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB} spl/u-boot-spl u-boot.bin flash.bin;;idbloader.img u-boot.itb"
	display_alert "lb2004" "UBOOT_TARGET_MAP=${UBOOT_TARGET_MAP}" "info"
}

# ---- Insert CONFIG_TARGET_EVB_RK3568=y into lb2004-rk3566_defconfig (post-patch, pre-make) ----
# kemp233/u-boot-1@rockchip-v2026.01 ships lb2004-rk3566_defconfig with DEFAULT_DEVICE_TREE
# but no CONFIG_TARGET_EVB_RK3568=y. Without it, `make olddefconfig` errors with
# "No board selected" because no TARGET_* was chosen and the board/rockchip/evb_rk3568/
# evb_rk3568.c board file can't be linked. We add the line via sed here instead of
# via per-board patch (the armbian Python patcher rejects .patch files for this
# defconfig with "No file to patch" — likely because the file's content is
# already exactly the right shape for the upstream maintainer's intended flow).
# cwd is the u-boot source tree (set by patch_uboot_target before this hook).
function pre_config_uboot_target__lb2004_rk3566_add_target() {
	display_alert "🌿🌿-start pre_config_uboot_target__lb2004_rk3566_add_target" "info"
	local defconfig="configs/lb2004-rk3566_defconfig"
	if [[ ! -f "${defconfig}" ]]; then
		display_alert "lb2004" "${defconfig} not found in $(pwd); skipping" "wrn"
		return 0
	fi
	if grep -q "^CONFIG_TARGET_EVB_RK3568=y" "${defconfig}"; then
		display_alert "lb2004" "${defconfig} already has CONFIG_TARGET_EVB_RK3568=y" "info"
		return 0
	fi
	sed -i 's|^CONFIG_COUNTER_FREQUENCY=24000000$|CONFIG_COUNTER_FREQUENCY=24000000\nCONFIG_TARGET_EVB_RK3568=y|' "${defconfig}"
	display_alert "lb2004" "added CONFIG_TARGET_EVB_RK3568=y to ${defconfig}" "info"
	display_alert "🌿🌿-end pre_config_uboot_target__lb2004_rk3566_add_target" "info"
}

# ---- Strip non-lb2004 DTBs from /boot/dtb/rockchip/ to fit in 256MB FAT32 boot ----
# rockchip64_common.inc builds dtbs for the whole family (~791 dtbs, 1.42GB).
# LB2004 only needs rk3566-lb2004.dtb. Without this, rsync to /boot fails
# with "No space left on device" at image creation time.
function pre_customize_image__lb2004_strip_extra_dtbs() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start pre_customize_image__lb2004_strip_extra_dtbs"
	local dtb_dir="${SDCARD}/boot/dtb/rockchip"
	if [[ -d "${dtb_dir}" ]]; then
		local kept=0 removed=0
		while IFS= read -r -d '' f; do
			local base="$(basename "${f}")"
			if [[ "${base}" == rk3566-lb2004.dtb || "${base}" == rk3566-lb2004.dtbo ]]; then
				kept=$((kept + 1))
			else
				rm -f "${f}"
				removed=$((removed + 1))
			fi
		done < <(find "${dtb_dir}" -maxdepth 1 -type f -print0)
		display_alert "lb2004" "dtb cleanup: kept ${kept}, removed ${removed}" "info"
	fi
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end pre_customize_image__lb2004_strip_extra_dtbs"
}
