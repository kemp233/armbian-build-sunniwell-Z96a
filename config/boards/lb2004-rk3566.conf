# Rockchip RK3566 quad core 1-8GB SoC GBe eMMC USB3
# LB2004 board: Sunwintac SW-001 RK3566, AP6212 WiFi/BT, RK809 PMIC
# Source: ophub/amlogic-s9xxx-armbian lb2004-rebase (DTS ported in 89cd34c5d)
BOARD_NAME="lb2004-rk3566"
BOARDFAMILY="rockchip-rk3568-z96a"
BOARD_MAINTAINER="z96a-kemp"
# Reuse z96a-v2 U-Boot defconfig — same RK356x SoC, same idbloader/u-boot.itb
BOOTCONFIG="z96a-rk3568-laptop-v2_defconfig"
LINUXCONFIG="linux-rockchip-rk3568-z96a-legacy"
KERNEL_TARGET="legacy"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3566-lb2004.dtb"
# Use standard rockchip64 boot script (no z96a-specific vdd_npu i2c hack)
BOOTSCRIPT='boot-rockchip64.cmd:boot.cmd'
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"
BOOTFS_TYPE="fat"

# Reuse z96a-v2 DDR/BL31 blobs — same RK356x SoC family
# (LB2004 may need its own blobs in future, but reusing works for first cut)
DDR_BLOB="rk35/rk3568_ddr_1184MHz_android5042_z96a.bin"
BL31_BLOB="bin/rk35/rk3568_bl31_v1.46.elf"

# Use rockchip-linux rkbin (same as z96a-v2)
RKBIN_GIT_URL="https://github.com/rockchip-linux/rkbin.git"
RKBIN_GIT_BRANCH="master"

# binman (kemp233/u-boot-1@rockchip-v2026.01) needs pyelftools to read BL31.elf
function add_host_dependencies__lb2004_pyelftools_for_binman() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}

# Use custom 6.1 kernel from kemp233/linux-rockchip (same as z96a-v2)
function post_family_config_branch_legacy__lb2004_custom_kernel() {
	declare -g KERNEL_MAJOR_MINOR="6.1"
	declare -g KERNELBRANCH='branch:rk-6.1-rkr5.1'
	declare -g KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
	declare -g LINUXCONFIG='linux-rockchip-rk3568-z96a-legacy'
	display_alert "Using kemp233/linux-rockchip 6.1.y kernel for" "${BOARD}" "info"
}

# Strip non-lb2004 DTBs from /boot/dtb/rockchip/ to fit in 256MB FAT32 boot.
# rockchip64_common.inc builds dtbs for the whole family (~791 dtbs, 1.42GB).
# LB2004 only needs rk3566-lb2004.dtb. Without this, rsync to /boot fails
# with "No space left on device" at image creation time.
function pre_customize_image__lb2004_strip_extra_dtbs() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start pre_customize_image__lb2004_strip_extra_dtbs"
	local dtb_dir="${SDCARD}/boot/dtb/rockchip"
	if [[ -d "${dtb_dir}" ]]; then
		local kept=0 removed=0
		while IFS= read -r -d '' f; do
			local base="$(basename "${f}")"
			if [[ "${base}" == rk3566-lb2004.dtb || "${base}" == rk3566-lb2004.dtbo ]]; then
				kept=$((kept + 1))
			else
				rm -f "${f}"
				removed=$((removed + 1))
			fi
		done < <(find "${dtb_dir}" -maxdepth 1 -type f -print0)
		display_alert "lb2004" "dtb cleanup: kept ${kept}, removed ${removed}" "info"
	fi
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end pre_customize_image__lb2004_strip_extra_dtbs"
}
