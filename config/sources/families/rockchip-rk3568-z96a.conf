source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

BOOTSOURCE='https://github.com/radxa/u-boot.git'
BOOTBRANCH='branch:stable-4.19-rock3'
BOOTPATCHDIR="legacy board_z96a-new"
OVERLAY_PREFIX='rk3568-z96a'

case $BRANCH in

	legacy)
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 8.0'
		BOOTDIR='u-boot-rockchip64'
		KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
		KERNELBRANCH='branch:rk-5.10-rkr6'
		declare -g -i KERNEL_GIT_CACHE_TTL=120 # 2 minutes; this is a high-traffic repo
		declare -g KERNEL_MAJOR_MINOR="5.10"   # Major and minor versions of this kernel.
		KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'

		;;

	current)
		# For the 'current' build branch we reuse the legacy kernel settings
		# to ensure a defined kernel branch for boards that expect 'current'.
		# If you need a different kernel for 'current', update these values.
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 8.0'
		BOOTDIR='u-boot-rockchip64'
		KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
		KERNELBRANCH='branch:rk-5.10-rkr6'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="5.10"
		KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'
		# Override LINUXFAMILY and LINUXCONFIG to use board-specific legacy config.
		# Without this, rockchip64_common.inc sets LINUXFAMILY=rockchip64 and
		# LINUXCONFIG=linux-rockchip64-current, which uses a generic config that
		# doesn't have our board-specific WiFi/PATCH adjustments, causing link errors.
		declare -g LINUXFAMILY=rockchip-rk3568-z96a
		declare -g LINUXCONFIG='linux-rockchip-rk3568-z96a-legacy'

		;;

esac

prepare_boot_configuration

family_tweaks_bsp() {
	:
}