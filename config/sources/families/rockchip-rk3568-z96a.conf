#
source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

# BOOTCONFIG is z96a-rk3568-laptop-v2_defconfig — force SOC for blob selection
declare -g BOOT_SOC="rk3568"
declare -g BOOT_SOC_MKIMAGE="rk3568"

BOOTSOURCE='https://github.com/kemp233/u-boot-1.git'
BOOTBRANCH='branch:rockchip-v2026.01'
BOOTPATCHDIR="u-boot-z96a-v2026.01"
BOOTDIR='u-boot-rockchip64'
BOOTCONFIG="z96a-rk3568-laptop-v2_defconfig"
OVERLAY_PREFIX='rk3568-z96a'

UBOOT_COMPILER="aarch64-linux-gnu-"
UBOOT_USE_GCC='> 8.0'

DDR_BLOB="${DDR_BLOB:-"rk35/rk3568_ddr_1560MHz_v1.13.bin"}"
BL31_BLOB="${BL31_BLOB:-"rk35/rk3568_bl31_v1.43.elf"}"
BOOT_SCENARIO="spl-blobs"

case $BRANCH in
	legacy)
		KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
		KERNELBRANCH='branch:rk-5.10-rkr6'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="5.10"
		KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'
		;;
	current)
		KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
		KERNELBRANCH='branch:rk-5.10-rkr6'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="5.10"
		KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'
		declare -g LINUXFAMILY=rockchip-rk3568-z96a
		declare -g LINUXCONFIG='linux-rockchip-rk3568-z96a-legacy'
		;;
	edge)
		KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
		KERNELBRANCH='branch:rk-6.1-rkr5.1'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="6.1"
		KERNELPATCHDIR='rockchip-rk3568-z96a/edge'
		declare -g LINUXFAMILY=rockchip-rk3568-z96a
		declare -g LINUXCONFIG='linux-rockchip-rk3568-z96a-edge'
		;;
esac

prepare_boot_configuration

# Mainline-style Rockchip U-Boot uses binman flash.bin (not make u-boot.itb).
# nanopi-r5s pattern: ROCKCHIP_TPL=... BL31=...flash.bin ;; package idbloader.img u-boot.itb
function post_family_config__z96a_uboot_v2026_target_map() {
	display_alert "Z96A" "override UBOOT_TARGET_MAP for u-boot-1 binman" "info"
	BOOTDELAY=3
	DDR_BLOB="${DDR_BLOB:-"rk35/rk3568_ddr_1560MHz_v1.13.bin"}"
	BL31_BLOB="${BL31_BLOB:-"rk35/rk3568_bl31_v1.43.elf"}"
	# Expand paths NOW (RKBIN_DIR already set by rockchip64_common.inc)
	UBOOT_TARGET_MAP="ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB} spl/u-boot-spl u-boot.bin flash.bin;;idbloader.img u-boot.itb"
	display_alert "Z96A" "UBOOT_TARGET_MAP=${UBOOT_TARGET_MAP}" "info"
}

function pre_config_uboot_target__z96a_install_ddr_and_fix_map() {
	local src1="${SRC}/packages/blobs/rockchip/rk35/rk3568_ddr_1184MHz_android5042_z96a.bin"
	local src2="${SRC}/packages/blobs/rockchip/z96a/rk3568_ddr_1184MHz_android5042_z96a.bin"
	local dst_dir="${SRC}/cache/sources/rkbin-tools/rk35"
	local dst="${dst_dir}/rk3568_ddr_1184MHz_android5042_z96a.bin"
	if [[ -f "${src1}" || -f "${src2}" ]]; then
		local src="${src1}"
		[[ -f "${src1}" ]] || src="${src2}"
		mkdir -p "${dst_dir}"
		run_host_command_logged cp -pv "${src}" "${dst}"
		DDR_BLOB="rk35/rk3568_ddr_1184MHz_android5042_z96a.bin"
		display_alert "Z96A" "installed custom DDR ${DDR_BLOB}" "info"
	fi
	# Always re-expand target map with final blob paths before make
	UBOOT_TARGET_MAP="ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB} spl/u-boot-spl u-boot.bin flash.bin;;idbloader.img u-boot.itb"
	display_alert "Z96A" "make vars TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB}" "info"
	if [[ ! -f "${RKBIN_DIR}/${BL31_BLOB}" ]]; then
		display_alert "Z96A" "BL31 missing: ${RKBIN_DIR}/${BL31_BLOB}" "wrn"
		ls -la "${RKBIN_DIR}/rk35/" 2>/dev/null | head -50 || true
	fi
	if [[ ! -f "${RKBIN_DIR}/${DDR_BLOB}" ]]; then
		display_alert "Z96A" "DDR missing: ${RKBIN_DIR}/${DDR_BLOB}" "wrn"
		ls -la "${RKBIN_DIR}/rk35/" 2>/dev/null | head -50 || true
	fi
}

function add_host_dependencies__z96a_uboot_pyelftools() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}

# After make flash.bin, ensure idbloader.img / u-boot.itb exist for packaging
# binman often writes idbloader.img and u-boot.itb (or flash.bin contains both)
function uboot_custom_postprocess() {
	display_alert "Z96A" "postprocess flash.bin -> idbloader/u-boot.itb" "info"
	# Prefer binman outputs if present
	if [[ -f flash.bin && ! -f idbloader.img ]]; then
		# rockchip flash.bin layout: idbloader at start; also try standard mkimage path
		if [[ -f spl/u-boot-spl.bin && -f "${RKBIN_DIR}/${DDR_BLOB}" ]]; then
			run_host_command_logged tools/mkimage -n rk3568 -T rksd \
				-d "${RKBIN_DIR}/${DDR_BLOB}:spl/u-boot-spl.bin" idbloader.img
		fi
	fi
	# Some builds name FIT u-boot.itb already; else copy from binman known names
	if [[ ! -f u-boot.itb ]]; then
		if [[ -f u-boot-rockchip.bin ]]; then
			run_host_command_logged cp -pv u-boot-rockchip.bin u-boot.itb
		elif [[ -f fit/u-boot.itb ]]; then
			run_host_command_logged cp -pv fit/u-boot.itb u-boot.itb
		fi
	fi
	ls -la idbloader.img u-boot.itb flash.bin spl/u-boot-spl.bin 2>/dev/null || true
}

family_tweaks_bsp() {
	:
}

# =============================================================================
# HAL single-source sync: U-Boot DT + Kernel contract (Recovery thr=9, SCMI clk)
# Canonical files: config/boards/hal/z96a-rk3568-laptop-v2/
# =============================================================================
function post_family_config__z96a_hal_paths() {
	declare -g Z96A_HAL_DIR="${SRC}/config/boards/hal/z96a-rk3568-laptop-v2"
	display_alert "Z96A-HAL" "HAL dir ${Z96A_HAL_DIR}" "info"
}

# Before U-Boot configure/make: force board DT from HAL into the U-Boot source tree
function pre_config_uboot_target__z96a_hal_inject_dt() {
	local HAL="${SRC}/config/boards/hal/z96a-rk3568-laptop-v2"
	if [[ ! -f "${HAL}/uboot/rk3568-z96a-laptop-v2.dts" ]]; then
		display_alert "Z96A-HAL" "missing HAL uboot dts — skip inject" "wrn"
		return 0
	fi
	display_alert "Z96A-HAL" "inject Recovery thr=9 DT into U-Boot tree $(pwd)" "info"
	# pwd is U-Boot build dir during this hook
	local f
	while IFS= read -r -d '' f; do
		run_host_command_logged cp -av "${HAL}/uboot/rk3568-z96a-laptop-v2.dts" "${f}"
	done < <(find . -name 'rk3568-z96a-laptop-v2.dts' -print0 2>/dev/null)
	while IFS= read -r -d '' f; do
		run_host_command_logged cp -av "${HAL}/uboot/rk3568-z96a-laptop-v2-u-boot.dtsi" "${f}"
	done < <(find . -name 'rk3568-z96a-laptop-v2-u-boot.dtsi' -print0 2>/dev/null)
	# If board DT not yet present, drop into arch/arm/dts
	if [[ -d arch/arm/dts && ! -f arch/arm/dts/rk3568-z96a-laptop-v2.dts ]]; then
		run_host_command_logged cp -av "${HAL}/uboot/rk3568-z96a-laptop-v2.dts" arch/arm/dts/
		run_host_command_logged cp -av "${HAL}/uboot/rk3568-z96a-laptop-v2-u-boot.dtsi" arch/arm/dts/
	fi
	# Prove thr=9 after inject
	if ! grep -q 'press-threshold-microvolt = <9>' arch/arm/dts/rk3568-z96a-laptop-v2.dts 2>/dev/null \
		&& ! find . -name 'rk3568-z96a-laptop-v2.dts' -exec grep -q 'press-threshold-microvolt = <9>' {} \; -print -quit | grep -q .; then
		display_alert "Z96A-HAL" "WARNING: thr=9 not found after inject" "wrn"
	else
		display_alert "Z96A-HAL" "U-Boot DT Recovery thr=9 confirmed" "info"
	fi
}

# After U-Boot packaging: archive the exact DT used
function uboot_custom_postprocess__z96a_hal_stamp() {
	display_alert "Z96A-HAL" "stamp u-boot.dtb strings for Recovery thr" "info"
	if [[ -f u-boot.dtb ]]; then
		strings u-boot.dtb | grep -E 'volume up|adc-keys' | head -5 || true
	fi
}
