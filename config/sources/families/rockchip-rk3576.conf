# RK3576: vendor DDR/SPL -> rebuilt mainline U-Boot -> vendor secure firmware.
source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

ARCH=arm64
OFFSET=16
BOOTSOURCE='https://github.com/kemp233/u-boot-1.git'
BOOTBRANCH='branch:rk3576-dev-20261125'
BOOTPATCHDIR='legacy'
OVERLAY_PREFIX='rk3576'
SERIALCON='ttyS0:1500000'
SRC_EXTLINUX='yes'
BOOTENV_FILE='rk3576-dev.txt'
BOOT_SCENARIO='spl-blobs'
BOOTDELAY=3
ATFSOURCE=''
ATF_COMPILE='no'
DDR_BLOB='rk35/rk3576_ddr_lp4_2112MHz_lp5_2736MHz_v1.13.bin'
BL31_BLOB='rk3576/bl31.elf'
TEE_BLOB='rk3576/tee.bin'
RKBIN_DIR="${SRC}/packages/blobs/rockchip"
KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
KERNELBRANCH='branch:rk-6.1-rkr7.2-sync-20261125'
KERNEL_MAJOR_MINOR='6.1'
KERNELPATCHDIR='rockchip-rk3576/legacy'
LINUXCONFIG='linux-rockchip-rk3576-legacy'

prepare_boot_configuration

function post_family_config__rk3576_uboot_inputs() {
	UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} TEE=${RKBIN_DIR}/${TEE_BLOB} u-boot.bin;;u-boot.bin"
}

function pre_config_uboot_target__rk3576_verify_blobs() {
	local blob
	for blob in "${BL31_BLOB}" "${TEE_BLOB}"; do
		[[ -s "${RKBIN_DIR}/${blob}" ]] || exit_with_error "RK3576 missing ${RKBIN_DIR}/${blob}"
	done
	UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} TEE=${RKBIN_DIR}/${TEE_BLOB} u-boot.bin;;u-boot.bin"
}

# Armbian edits .config after the defconfig target. Reconcile those edits
# before make invokes its interactive syncconfig rule.
function post_config_uboot_target__rk3576_noninteractive_config() {
	# The final make passes TEE=/BL31= on its command line. Kconfig evaluates
	# HAS_TEE_IN_BUILD_ENV from those variables, so the config must be closed
	# with the SAME environment; otherwise the final syncconfig sees new
	# unset symbols (OPTEE_TZDRAM_SIZE etc.) and drops into interactive mode.
	run_host_command_logged make olddefconfig CROSS_COMPILE=aarch64-linux-gnu- \
		"BL31=${RKBIN_DIR}/${BL31_BLOB}" "TEE=${RKBIN_DIR}/${TEE_BLOB}"
	grep -E '^(CONFIG_OPTEE_LIB|CONFIG_HAS_TEE_IN_BUILD_ENV|CONFIG_BOOTCOMMAND|CONFIG_BOOTDELAY)=' .config
}

function add_host_dependencies__rk3576_pyelftools() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}

# We boot through the vendor DDR/SPL idblock, so the stock spl-blobs
# mkimage postprocessing (which expects a standalone DDR_BLOB) is not needed.
function uboot_custom_postprocess() {
	:
}

function write_uboot_platform() {
	local logging_prelude=""
	[[ $(type -t run_host_command_logged) == function ]] && logging_prelude="run_host_command_logged"
	local dir="${SRC}/packages/blobs/rockchip/rk3576"
	local idb="${dir}/vendor-idblock-copy.bin"
	[[ -s "${idb}" ]] || exit_with_error "RK3576 idblock blob missing"
	# Build the FIT inline from small blobs + freshly compiled u-boot.bin.
	# Inline here because the write hook runs after packaging, when external
	# script paths under ${SRC} are not guaranteed to be mounted.
	local work fit
	work=$(mktemp -d)
	fit="${work}/rk3576-fit.itb"
	cp "${dir}/atf-1.bin" "${work}/atf-1.bin"
	cp "${dir}/tee.bin" "${work}/optee.bin"
	cp "${dir}/atf-2.bin" "${work}/atf-2.bin"
	cp "${dir}/atf-3.bin" "${work}/atf-3.bin"
	cp "${dir}/fdt.dtb" "${work}/fdt.dtb"
	cp "$1/u-boot.bin" "${work}/u-boot.bin"
	cat > "${work}/rk3576.its" <<'ITS'
/dts-v1/;
/ {
	description = "RK3576 mainline U-Boot with vendor secure firmware";
	#address-cells = <1>;
	images {
		uboot { description = "Mainline U-Boot"; data = /incbin/("u-boot.bin"); type = "standalone"; arch = "arm64"; os = "u-boot"; compression = "none"; load = <0x40200000>; entry = <0x40200000>; hash { algo = "sha256"; }; };
		atf-1 { description = "ATF primary"; data = /incbin/("atf-1.bin"); type = "firmware"; arch = "arm64"; os = "arm-trusted-firmware"; compression = "none"; load = <0x40060000>; entry = <0x40060000>; hash { algo = "sha256"; }; };
		atf-2 { description = "ATF secondary"; data = /incbin/("atf-2.bin"); type = "firmware"; arch = "arm64"; os = "arm-trusted-firmware"; compression = "none"; load = <0x400f0000>; hash { algo = "sha256"; }; };
		atf-3 { description = "ATF PM"; data = /incbin/("atf-3.bin"); type = "firmware"; arch = "arm64"; os = "arm-trusted-firmware"; compression = "none"; load = <0x3fe70000>; hash { algo = "sha256"; }; };
		optee { description = "OP-TEE"; data = /incbin/("optee.bin"); type = "firmware"; arch = "arm64"; os = "tee"; compression = "none"; load = <0x48400000>; entry = <0x48400000>; hash { algo = "sha256"; }; };
		fdt { description = "RK3576 DTB"; data = /incbin/("fdt.dtb"); type = "flat_dt"; arch = "arm64"; compression = "none"; hash { algo = "sha256"; }; };
	};
	configurations {
		default = "conf";
		conf { description = "RK3576 mainline U-Boot"; firmware = "atf-1"; loadables = "uboot", "atf-2", "atf-3", "optee"; fdt = "fdt"; };
	};
};
ITS
	mkimage -f "${work}/rk3576.its" -A arm64 -T rksd -n rk3576-dev "$fit"
	[[ -s "$fit" ]] || exit_with_error "RK3576 FIT build failed"
	# Verified boot layout: vendor DDR/SPL at LBA64 + LBA2048,
	# validated U-Boot FIT at LBA16384.
	${logging_prelude} dd if="${idb}" of="$2" seek=64 conv=notrunc status=none
	${logging_prelude} dd if="${idb}" of="$2" seek=2048 conv=notrunc status=none
	${logging_prelude} dd if="${fit}" of="$2" seek=16384 conv=notrunc status=none
	rm -rf "${work}"
}

function family_tweaks_bsp() {
