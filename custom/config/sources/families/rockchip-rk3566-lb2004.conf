#
# LB2004 (RK3566) family config - independent of Z96A.
#
# The LB2004 board must NOT inherit Z96A's boot script (PMIC I2C vdd_npu
# hack), overlay prefix, or DDR blob.  This family sources the common
# rockchip64 include and only sets the shared U-Boot/kernel sources.
#

source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

# kemp233's U-Boot fork (shared with z96a - same repo, different defconfig)
BOOTSOURCE='https://github.com/kemp233/u-boot-1.git'
BOOTBRANCH='branch:rockchip-v2026.01'
BOOTPATCHDIR="legacy"

# BOOTSCRIPT must be set AFTER sourcing rockchip64_common.inc, which sets
# BOOTSCRIPT='boot-rockchip64.cmd:boot.cmd'.  The board config also sets it,
# but the family config is sourced later and overrides the board value.
# Use the LB2004-specific boot script (no Z96A PMIC I2C vdd_npu hack).
BOOTSCRIPT='boot-lb2004-rk3566.cmd:boot.cmd'

# LB2004 overlay prefix: use rk3566, not rk3568-z96a.
OVERLAY_PREFIX='rk3566'

case $BRANCH in

	legacy)
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 13'
		BOOTDIR='u-boot-rockchip64'
		KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
		KERNELBRANCH='branch:rk-6.1-rkr5.1'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="6.1"
		KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'
		;;

	edge)
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 13'
		BOOTDIR='u-boot-rockchip64'
		KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
		KERNELBRANCH='branch:rk-6.6-rkr6.6'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="6.6"
		KERNELPATCHDIR='rockchip-rk3568-z96a/legacy'
		;;

esac

prepare_boot_configuration

# U-Boot target map override (kemp233/u-boot-1@rockchip-v2026.01 uses binman).
# The board config supplies the correct RK3566 DDR blob via DDR_BLOB;
# expand it here.  This runs after the board's
# post_family_config__lb2004_uboot_v2026_target_map hook, so it must NOT
# clobber DDR_BLOB/BL31_BLOB - only expand UBOOT_TARGET_MAP.
#
# Package idbloader.img + u-boot.itb (same as z96a).  binman's u-boot.itb
# includes the FIT header (3584 bytes) PLUS the external data payload
# (~1.2MB) appended after it.  The stock write_uboot_platform writes
# idbloader.img at sector 64 and u-boot.itb at sector 16384
# (= CONFIG_SYS_MMCSD_RAW_MODE_U_BOOT_SECTOR), which is what the SPL
# expects.  This is the same layout z96a uses successfully.
function post_family_config__lb2004_uboot_v2026_target_map() {
	display_alert "lb2004" "override UBOOT_TARGET_MAP for u-boot-1 binman" "info"
	BOOTDELAY=3
	UBOOT_TARGET_MAP="ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB} spl/u-boot-spl u-boot.bin flash.bin;;idbloader.img u-boot.itb"
	display_alert "lb2004" "UBOOT_TARGET_MAP=${UBOOT_TARGET_MAP}" "info"
}

# RTL8822CS WiFi firmware (shared with z96a - same SDIO module)
family_tweaks_bsp() {
	local fwsrc="${SRC}/packages/blobs/wifi-rtl8822cs"
	if [[ -d "${fwsrc}" ]]; then
		mkdir -p "${destination}"/lib/firmware
		run_host_command_logged cp -v "${fwsrc}"/rtl8822cs_fw.bin "${destination}"/lib/firmware/
		run_host_command_logged cp -v "${fwsrc}"/rtl8822cs_config "${destination}"/lib/firmware/
	fi
}
