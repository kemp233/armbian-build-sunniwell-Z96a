# SPDX-License-Identifier: GPL-2.0+
#
# Family: rockchip-rk3568-dh — Dahua RK3568 boards (dh-asi8212sa)
#
# Fully independent of rockchip-rk3568-z96a: own kernel patch dir, own
# bootscript, own overlay prefix. Same SoC bring-up pattern though: the
# kemp233 u-boot-1 (binman flash.bin) and the kemp233 vendor 6.1 kernel.
#
source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

BOOTSOURCE='https://github.com/kemp233/u-boot-1.git'
BOOTBRANCH='branch:rockchip-v2026.01'
BOOTPATCHDIR="legacy"
OVERLAY_PREFIX='rk3568-dh'

# Dedicated bootscript (no z96a RK809 I2C hacks — the DH board's PMIC is
# on a private I2C bus and comes up at reset defaults).
BOOTSCRIPT='boot-dh-asi8212sa.cmd:boot.cmd'

case $BRANCH in

	legacy)
		UBOOT_COMPILER="aarch64-linux-gnu-"
		UBOOT_USE_GCC='< 13'
		BOOTDIR='u-boot-rockchip64'
		KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
		KERNELBRANCH='branch:rk-6.1-rkr7.2'
		declare -g -i KERNEL_GIT_CACHE_TTL=120
		declare -g KERNEL_MAJOR_MINOR="6.1"
		KERNELPATCHDIR='rockchip-rk3568-dh/legacy'
		;;

esac

prepare_boot_configuration

# kemp233/u-boot-1@rockchip-v2026.01 uses binman flash.bin (same as z96a).
function post_family_config__dh_uboot_v2026_target_map() {
	display_alert "DH" "override UBOOT_TARGET_MAP for u-boot-1 binman" "info"
	BOOTDELAY=3
	DDR_BLOB="${DDR_BLOB:-"rk35/rk3568_ddr_1056MHz_v1.10.bin"}"
	BL31_BLOB="${BL31_BLOB:-"rk35/rk3568_bl31_v1.46.elf"}"
	UBOOT_TARGET_MAP="ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB} spl/u-boot-spl u-boot.bin flash.bin;;idbloader.img u-boot.itb"
	display_alert "DH" "UBOOT_TARGET_MAP=${UBOOT_TARGET_MAP}" "info"
}

# DDR blob: 1056MHz production blob v1.10 — this is the DDR init proven to
# work on this board twice: the July maskrom backups were made with
# rk356x_spl_loader_ddr1056_v1.10.111.bin, and the same TPL downloaded
# successfully from the Linux host (the 1560MHz variants brown out the
# board mid-download on marginal power).
function pre_config_uboot_target__dh_ddr_blob() {
	DDR_BLOB="rk35/rk3568_ddr_1056MHz_v1.10.bin"
	UBOOT_TARGET_MAP="ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB} spl/u-boot-spl u-boot.bin flash.bin;;idbloader.img u-boot.itb"
	display_alert "DH" "make vars TPL=${RKBIN_DIR}/${DDR_BLOB} BL31=${RKBIN_DIR}/${BL31_BLOB}" "info"
}

# binman needs pyelftools to read BL31.elf
function add_host_dependencies__dh_pyelftools_for_binman() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}
