# binman (kemp233/u-boot-1@rockchip-v2026.01) needs pyelftools to read BL31.elf
function add_host_dependencies__z96a_pyelftools_for_binman() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-pyelftools"
}

# armbian/build-framework host image ships an old debian-archive-keyring
# missing the F8D2585B8783D481 (Debian 12 bookworm) Release signer key, which
# makes debootstrap fail on target=build with:
#   E: Release signed by unknown key (key id F8D2585B8783D481)
# Workaround: pull the key directly from a debian-bookworm source apt entry
# and install the matching debian-archive-keyring package. We use
# [trusted=yes] so apt skips the unsigned Release check, then immediately
# remove the temp source. The package is from the official Debian pool
# at deb.debian.org; the contained keyring is the same file that ships
# with the bookworm distribution, which is what debootstrap ultimately
# needs to verify the bookworm Release signature.
function add_host_dependencies__z96a_bookworm_release_key() {
	KEY_ID="F8D2585B8783D481"
	KEYRING="/usr/share/keyrings/debian-archive-keyring.gpg"
	if ! gpg --no-default-keyring --keyring "$KEYRING" --list-keys "$KEY_ID" >/dev/null 2>&1; then
		echo "[z96a] Fetching Debian 12 bookworm Release key $KEY_ID"
		# Add a one-shot Debian bookworm source, install the modern
		# debian-archive-keyring, then drop the source. Trust=yes makes
		# apt skip Release verification for the install.
		echo "deb [trusted=yes] http://deb.debian.org/debian bookworm main" \
			> /etc/apt/sources.list.d/z96a-bookworm-keyring.list
		if apt-get update -o Acquire::AllowInsecureRepositories=true \
			-o Acquire::Check-Valid-Until=false 2>&1 | grep -E "^(Get|Hit|Err):" | tail -5; then
			:
		fi
		# Install the modern keyring from bookworm pool. --allow-unauthenticated
		# is needed because we declared the source as [trusted=yes] which makes
		# apt consider the repo trusted, but the keyring package itself is
		# verified by apt against the source's Release file (which we trust).
		if apt-get install -y -o APT::Get::AllowUnauthenticated=true \
			-o Acquire::AllowInsecureRepositories=true \
			debian-archive-keyring 2>&1 | tail -3; then
			echo "[z96a] installed debian-archive-keyring from bookworm pool"
		else
			echo "[z96a] apt-get install failed"
		fi
		# Remove the one-shot source so it doesn't affect later apt invocations.
		rm -f /etc/apt/sources.list.d/z96a-bookworm-keyring.list
		apt-get update -o Acquire::Check-Valid-Until=false 2>/dev/null || true
	fi
}

# Use custom 6.1 kernel from kemp233/linux-rockchip
function post_family_config_branch_legacy__z96a_custom_kernel() {
	declare -g KERNEL_MAJOR_MINOR="6.1"
	declare -g KERNELBRANCH='branch:rk-6.1-rkr5.1'
	declare -g KERNELSOURCE='https://github.com/kemp233/linux-rockchip.git'
	declare -g LINUXCONFIG='linux-rockchip-rk3568-z96a-legacy'
	display_alert "Using kemp233/linux-rockchip 6.1.y kernel for" "${BOARD}" "info"
}

# rkvdec ownership: MPP rkvdec2 (vendor VPU) must own rkvdec@fdf80200.
#
# 这一段以前是反着写的，理由是"staging rkvdec (V4L2) 会和 MPP rkvdec2 抢同一个
# DT 节点"。那个理由在本内核树上不成立，已实测：
#
#   drivers/staging/media/rkvdec/rkvdec.c:996  of_rkvdec_match[] 只有
#       { .compatible = "rockchip,rk3399-vdec" }
#   整个内核树里认 "rockchip,rkv-decoder-rk3568" 的驱动只有一个：
#       drivers/video/rockchip/mpp/mpp_rkvdec2.c:1752
#   也就是说 staging 那个 V4L2 驱动在 RK3568 上根本绑不上这个节点，谈不上"抢"。
#
# 而 RKVDEC2 被关掉之后，节点只剩 MPP 的 V1 驱动 (mpp_rkvdec.c:1834
# "rockchip,rkv-decoder-v1") 能认。V1 用的是 RK3288/3399 时代的转址表
# {4,6,7,10,...,41,42,43,48,75}，而 RK3568 的 vdpu383 写的是寄存器
# 128~232（reg128_strm_base / reg168_decout_base / reg170_185_ref_base[16]）。
# 两套完全不相交的编号，内核就会去读"寄存器 10"——在 vdpu383 布局里那是个
# 无关字段，值是 0x00000001，& 0x3ff 得到 fd=1，再 dma_buf_get(1) 打在
# /dev/null 上，-EINVAL。板上的日志正是：
#
#   mpp_translate_reg_address:1897: reg[ 10]: 0x00000001 fd 1 failed
#   mpp_dma_import_fd:223: dma_buf_get fd 1 failed(-22)
#   mpp_rkvdec fdf80200.rkvdec: no memory region mapped
#
# 所以这里必须开着 RKVDEC2，并且 DTB 的 compatible 第一个串得是
# rockchip,rkv-decoder-rk3568（见 extensions/rockchip-multimedia.sh 的
# _rockchip_multimedia_setup_vdec_mpp_owner）。
function custom_kernel_config__z96a_staging_rkvdec() {
	[[ -f .config ]] || return 0
	# vendor MPP rkvdec2: the only driver in this tree that matches
	# "rockchip,rkv-decoder-rk3568" (mpp_rkvdec2.c, needs CONFIG_CPU_RK3568).
	kernel_config_set_y CONFIG_ROCKCHIP_MPP_RKVDEC2
	kernel_config_set_y CONFIG_ROCKCHIP_MPP_RKVDEC
	# staging V4L2 rkvdec 只认 rk3399-vdec, 在 RK3568 上没用还白占一堆
	# V4L2 stateless 依赖; 关掉, 免得以后有人再被它抢节点的假设误导。
	kernel_config_set_n CONFIG_VIDEO_ROCKCHIP_VDEC
	kernel_config_set_n CONFIG_STAGING_MEDIA
}


function post_family_config__bluetooth_hciattach_add_bluetooth_packages() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start post_family_config__bluetooth_hciattach_add_bluetooth_packages"
	display_alert "✅✅✅✅${BOARD}" "adding vim net-tools to image..."
	add_packages_to_image vim net-tools network-manager-openvpn-gnome


	# fcitx5 / guvcview 这段原来套了个 `if [[ "${RELEASE}" == "jammy" ]]`。
	# 这块板实际用 bookworm, 于是这层判断让下面这些包一次都没进过镜像:
	# 中文输入法 (fcitx5 全家桶) 和摄像头 (guvcview) 都没了。
	# 这些包 bookworm arm64 全部有 (packages.debian.org 逐个核过), 跟发行版
	# 无关, 所以把这层判断去掉, 只留 BUILD_DESKTOP 判断。
	if [[ "${BUILD_DESKTOP}" == "yes" ]]; then
		display_alert "✅✅✅✅${BOARD}" "adding guvcview fcitx5 to image..."
		add_packages_to_image guvcview fcitx5 fcitx5-chinese-addons fcitx5-config-qt fcitx5-frontend-gtk4 fcitx5-frontend-gtk3 fcitx5-frontend-gtk2 im-config zenity
	fi



	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end post_family_config__bluetooth_hciattach_add_bluetooth_packages"
}


function pre_customize_image__z96a_enbluetooth() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start pre_customize_image__z96a_enbluetooth"
	display_alert "${BOARD}" "install bluetooth firmware"
	local TMPDIR

	# download firmware
	display_alert "✅✅✅✅${BOARD}" "git clone bluetooth firmware"
	TMPDIR=$(mktemp -d)
	pushd "${TMPDIR}" || exit 1
	git clone https://github.com/Evaneee/Armbian-software.git || exit 1
	cd Armbian-software || exit 1

	# Install the firmware and utility
	display_alert "✅✅✅✅${BOARD}" "Install the firmware..."
	mkdir -p "${SDCARD}/lib/firmware/rtl_bt"
	cp -fr bluetooth/rtl8821cs_config "${SDCARD}/lib/firmware/rtl_bt/"
	cp -fr bluetooth/rtl8821cs_fw "${SDCARD}/lib/firmware/rtl_bt/"
	cp -fr bluetooth/bt_load_rtk_firmware "${SDCARD}/usr/local/bin/"
	cp -fr bluetooth/rtk_hciattach "${SDCARD}/usr/local/bin/"

	cp -fr adbd "${SDCARD}/usr/local/bin/"
	cp -fr adbservice "${SDCARD}/usr/local/bin/"
	cp -fr io "${SDCARD}/usr/local/bin/"
	cp -fr jtagactive "${SDCARD}/usr/local/bin/"
	cp -fr jtaginquire "${SDCARD}/usr/local/bin/"


	chroot_sdcard chmod +x /usr/local/bin/{rtk_hciattach,bt_load_rtk_firmware,adbd,adbservice,io,jtagactive,jtaginquire}

	display_alert "✅✅✅✅${BOARD}" "setup bluetooth bluetooth-rtl8821cs.service..."
	# Systemd service
	cat > "${SDCARD}/etc/systemd/system/bluetooth-rtl8821cs.service" <<- EOD
		[Unit]
		Description=RTL8821CS Firmware Service
		After=network.target

		[Service]
		Type=oneshot
		ExecStart=/usr/local/bin/bt_load_rtk_firmware
		RemainAfterExit=true
		StandardOutput=journal

		[Install]
		WantedBy=multi-user.target
	EOD
	chroot_sdcard systemctl enable bluetooth-rtl8821cs.service
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end pre_customize_image__z96a_enbluetooth"
}

function pre_customize_image__z96a_ensound() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start pre_customize_image__z96a_ensound"
	display_alert "✅✅✅✅${BOARD}" "write /etc/asound.conf..."
	# The codec only exposes S16LE 44.1kHz. YouTube (Opus 48kHz) and other
	# 48kHz sources are silent with a direct plug->hw chain because ALSA
	# refuses to re-open the hardware device at a foreign rate. Wrap hw
	# with type "rate" so any incoming rate is converted to the codec's
	# native 44.1kHz before reaching the hardware. type plug on top
	# auto-handles any source format.
	cat > "${SDCARD}/etc/asound.conf" <<- EOD
		pcm.!default {
			type plug
			slave.pcm "rateconv"
		}

		pcm.rateconv {
			type rate
			slave {
				pcm "qhw"
				format S16_LE
				rate 44100
			}
		}

		pcm.qhw {
			type hw
			card 1
		}

		ctl.!default {
			type hw
			card 1
		}
	EOD
	display_alert "✅✅✅✅${BOARD}" "setup amixer_enspk1.service..."
	# Systemd service
	cat > "${SDCARD}/etc/systemd/system/amixer_enspk1.service" <<- EOD
		[Unit]
		Description=amixer_enspk1 Service
		After=network.target

		[Service]
		Type=oneshot
		ExecStart=/usr/bin/amixer -c 1 set 'Playback Path' SPK
		RemainAfterExit=true
		StandardOutput=journal

		[Install]
		WantedBy=multi-user.target
	EOD
	chroot_sdcard systemctl enable amixer_enspk1.service
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end pre_customize_image__z96a_ensound"
}

# Strip non-z96a DTBs from /boot/dtb/rockchip/ to fit in 256MB FAT32 boot
# partition. The rockchip64_common.inc builds dtbs for the whole family
# (rk3588, rk3566, rk3399, etc. — 791 dtbs, 1.42GB total). The z96a board
# only needs rk3568-z96a-laptop-v2.dtb. Without this, rsync to /boot fails
# with "No space left on device" at image creation time.
function pre_customize_image__z96a_strip_extra_dtbs() {
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start pre_customize_image__z96a_strip_extra_dtbs"
	local dtb_dir="${SDCARD}/boot/dtb/rockchip"
	if [[ -d "${dtb_dir}" ]]; then
		# Keep only the z96a DTBs; remove everything else
		local kept=0 removed=0
		while IFS= read -r -d '' f; do
			local base="$(basename "${f}")"
			if [[ "${base}" == rk3568-z96a-*.dtb || "${base}" == rk3568-z96a-*.dtbo ]]; then
				kept=$((kept + 1))
			else
				rm -f "${f}"
				removed=$((removed + 1))
			fi
		done < <(find "${dtb_dir}" -maxdepth 1 -type f -print0)
		display_alert "z96a" "dtb cleanup: kept ${kept}, removed ${removed}" "info"
	fi
	display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end pre_customize_image__z96a_strip_extra_dtbs"
}


function post_family_tweaks__z96a_enable_ppa() {
	[[ "${BUILD_DESKTOP}" == "yes" ]] || return 0

	case "${RELEASE}" in
		jammy|noble)
			display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start post_family_tweaks__z96a_enable_ppa"
			display_alert "Adding qcom-mainline PPA" "${BOARD}" "info"
			do_with_retries 3 chroot_sdcard add-apt-repository ppa:liujianfeng1994/rockchip-multimedia  --yes
			do_with_retries 3 chroot_sdcard apt dist-upgrade --yes
			do_with_retries 3 chroot_sdcard apt install rockchip-multimedia-config
			do_with_retries 3 chroot_sdcard apt install ffmpeg chromium-browser{,-l10n} chromium-codecs-ffmpeg-extra --yes
			display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end post_family_tweaks__z96a_enable_ppa"
			;;
		bookworm)
			# Debian 上没有 ppa:liujianfeng1994/rockchip-multimedia —— 那是 Ubuntu 专用
			# PPA, 而且 Debian 的 add-apt-repository 也不认 ppa: 前缀, 原来那句
			# 在 bookworm 下因为外层 RELEASE == jammy 挡着才没炸。现在这层判断拿掉了,
			# 就必须在这里显式分开, 否则会在 bookworm 上直接跑 add-apt-repository ppa:。
			#
			# PPA 里的 rockchip-multimedia-config 也不要了: MPP / RGA / RKNN 和 VA 驱动
			# 现在都由 custom/extensions/rockchip-multimedia.sh 从源码编出来,
			# 那个配置包本来就没被真正用到。
			#
			# 剩下这两样还是要装的 (yt-dlp / mpv 之外的转码场景要 ffmpeg, 看 YouTube
			# 要浏览器), 从 bookworm 自己的源装。包名两处都不一样, 别照抄 Ubuntu 那行:
			#   ffmpeg                          两边同名
			#   chromium-browser / chromium      Ubuntu 叫前者, Debian 叫后者
			#   chromium-codecs-ffmpeg-extra     bookworm 没有这个包 (全架构全 section
			#                                     搜过), 而且也不需要: Debian 的 chromium
			#                                     编译时已带 ffmpeg 和 proprietary_codecs,
			#                                     H.264/AAC 开箱可用。那个包是给 Ubuntu
			#                                     的 chromium 补 proprietary codec 用的。
			display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-start post_family_tweaks__z96a_enable_ppa"
			do_with_retries 3 chroot_sdcard apt install ffmpeg chromium --yes
			display_alert "🌿🌿🌿🌿🌿🌿🌿🌿🌿-end post_family_tweaks__z96a_enable_ppa"
			;;
	esac
	return 0
}

# Override install_deb_chroot to allow downgrades and refresh apt cache.
# The framework function (lib/functions/rootfs/apt-install.sh) runs
# apt-get install -y --no-install-recommends <package_file> inside chroot.
# The argument can be either a .deb file path (local artifact) or a bare
# package name (resolved from apt repos). On bookworm, base-files downgrade
# fails without --allow-downgrades. Also, the chroot's apt cache may be
# stale, so dependencies like fping are reported as "not installable"
# even though they exist in the repo.
# We define this here so it overrides the framework version when
# install_distribution_specific -> install_artifact_deb_chroot -> install_deb_chroot.
function install_deb_chroot() {
	local package_arg="$1"
	local target_root="${SDCARD}"
	
	display_alert "Installing (with --allow-downgrades):" "${package_arg}" "info"
	
	# Refresh apt cache so dependencies are resolvable
	chroot_sdcard apt-get update -o Acquire::Check-Valid-Until=false 2>/dev/null || true
	
	if [[ -f "${package_arg}" ]]; then
		# Local .deb file: copy to chroot and install
		cp "${package_arg}" "${target_root}/root/"
		local pkg_basename="$(basename "${package_arg}")"
		chroot_sdcard apt-get install -y --allow-downgrades --no-install-recommends "/root/${pkg_basename}"
		rm -f "${target_root}/root/${pkg_basename}"
	else
		# Bare package name: let apt resolve it from configured sources
		chroot_sdcard apt-get install -y --allow-downgrades --no-install-recommends "${package_arg}"
	fi
}
