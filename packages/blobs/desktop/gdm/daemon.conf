[daemon]
# Wayland is the primary session on this board: the Mali wayland-gbm blob
# only exposes the EGL wayland/gbm platforms, so GNOME-on-X11 would fall
# back to llvmpipe software rendering. Keep wayland enabled.
WaylandEnable=true

# Prefer the wayland session when the user has not picked one explicitly.
PreferredDisplayServer=wayland

# The greeter also runs under wayland so it gets Mali EGL compositing.
DisplayStartupCommand=/usr/libexec/gnome-wayland-session --mode=greeter

[security]
# Z96A 是调试板, 桌面会话以 root 跑 (Mali/硬解排查都直接 root)。没有这个,
# greeter 的 "Not listed?" 输 root 会被 gdm 拒掉 —— 本镜像刷机后就栽在这:
# 用户用 armbian-config 配了半天 gdm3, 其实卡的是 root 图形登录被默认配置
# 禁止。root 不会出现在 greeter 用户列表里 (accountsservice 不列 UID 0),
# 登录走 "Not listed?" -> root -> 密码。
AllowRoot=true
